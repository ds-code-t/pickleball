<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Element state fixture</title></head>
<body>
<button id="off-button" type="button">Go</button>
<button id="on-disabled" type="button" disabled>Stop</button>
<div id="host"><button id="child-disabled" disabled>Nested</button></div>
<input id="needed" required value="x">
<div id="blank"></div>
<div id="filled">Hello</div>
<input id="empty-input" value="">
<div id="closed" aria-expanded="false">Closed</div>
<div id="open" aria-expanded="true">Open</div>
<div id="plain">Plain</div>
<input id="box" type="checkbox" checked>
<input id="empty-box" type="checkbox">
<div id="pressed" aria-pressed="true">Pressed</div>
<select id="choice"><option id="opt" value="a" selected>A</option></select>
</body>
</html>
