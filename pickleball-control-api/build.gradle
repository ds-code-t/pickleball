plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    // Internal source-module dependency only. Consumers receive these classes
    // from the main shaded Pickleball artifact.
    api project(':')
}

tasks.withType(JavaCompile).configureEach {
    dependsOn rootProject.tasks.named('ajcMain')
    options.encoding = 'UTF-8'
}

// Keep the control API as a separate source module, but bundle its output into
// the single public tools.dscode:pickleball artifact.
def controlApiOutput = sourceSets.main.output
def controlApiSources = sourceSets.main.allJava
def controlApiClasses = tasks.named('classes')

rootProject.tasks.named('shadowJar').configure {
    dependsOn controlApiClasses
    from(controlApiOutput)
}

rootProject.tasks.named('sourcesJar').configure {
    from(controlApiSources)
}
