plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    // Internal source-module dependency only. Consumers receive these classes
    // from the main shaded Pickleball artifact.
    api project(':')

    // Browser-evidence and element-inspection bridge code compiles against
    // Selenium types exposed by the main project implementation without
    // promoting Selenium to this internal module's public API.
    compileOnly('org.seleniumhq.selenium:selenium-java') {
        version { strictly('[4.44,5.0)') }
    }

    // Element inspection reuses ExecutionDictionary.CategoryResolution, whose
    // internal XPath representation is backed by the root project's bundled
    // XPathy library. Keep it compile-only here so the control module does not
    // create a second public dependency contract.
    compileOnly rootProject.files('libs/xpathy-3.0.0.jar')
}

tasks.withType(JavaCompile).configureEach {
    dependsOn rootProject.tasks.named('ajcMain')
    options.encoding = 'UTF-8'
}

// Keep the control API as a separate source module, but bundle its output into
// the single public tools.dscode:pickleball artifact.
def controlApiOutput = sourceSets.main.output
def controlApiSources = sourceSets.main.allJava
def controlApiClasses = tasks.named('classes')

rootProject.tasks.named('shadowJar').configure {
    dependsOn controlApiClasses
    from(controlApiOutput)
}

rootProject.tasks.named('sourcesJar').configure {
    from(controlApiSources)
}
