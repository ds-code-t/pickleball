pluginManagement {
    repositories {
        gradlePluginPortal()
        // The portal does not always proxy a plugin's Maven Central dependencies.
        // A cold Gradle cache then fails configuration looking only at plugins.gradle.org.
        mavenCentral()
    }
}

rootProject.name = 'pickleball'

include 'pickleball-control-api'
include 'pickleball-control-protocol'
include 'pickleball-workbench'
include 'dom-engine'

gradle.beforeProject { project ->
    if (project.path == ':') {
        project.apply from: new File(settingsDir, 'gradle/pickleball-build-provenance.gradle')
        project.apply from: new File(settingsDir, 'gradle/consumer-guidance.gradle')
    }
}
