plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'maven-publish'
    id 'signing'
    id("io.github.gradle-nexus.publish-plugin") version "2.0.0"
}

group = 'tools.dscode'
version = '3.0.0'

repositories {
    mavenCentral()
//    maven { url 'https://jitpack.io' }
}

def cucumberVersion = findProperty('cucumberVersion') ?: '7.27.2'
def aspectjVersion = findProperty('aspectjVersion') ?: '1.9.24'
def messagesVersion = findProperty('messagesVersion') ?: '29.0.1'
def gherkinVersion = findProperty('gherkinVersion') ?: '35.1.0'

// List of modules to weave (add more entries here later)
def toWeave = [
        [group: 'io.cucumber', name: 'cucumber-core', version: cucumberVersion],
        [group: 'io.cucumber', name: 'cucumber-gherkin', version: cucumberVersion],
        [group: 'io.cucumber', name: 'cucumber-gherkin-messages', version: cucumberVersion],
        [group: 'io.cucumber', name: 'cucumber-java', version: cucumberVersion],
        [group: 'io.cucumber', name: 'cucumber-plugin', version: cucumberVersion],
        [group: 'io.cucumber', name: 'messages', version: messagesVersion],
        [group: 'io.cucumber', name: 'gherkin', version: gherkinVersion],
]

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }

    // Maven Central expects these companion artifacts
    withSourcesJar()
    withJavadocJar()
}

// Optional: make javadoc generation less fragile on modern JDKs
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

sourceSets {
    main { java { srcDirs = ['src/main/java', 'src/main/aspectj'] } }
    // Fixture runners must not land in build/classes/java/test. That directory is a
    // consumer test-output root, and discovery requires exactly one runner there.
    runnerFixtures {
        java.srcDir 'src/runnerFixtures/java'
    }
    // Consumer glue for dual-run. Not a test source set, so its JUnit checks are not executed here.
    consumerGlue {
        java.srcDir 'maven-consumer-project/src/test/java'
    }
    test { java { srcDirs += ['src/test/aspectj', 'src/testSupport/java'] } }
}

configurations {
    // JARs we want to weave (allow transitives for type resolution)
    weaveLibs {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
        exclude group: 'net.bytebuddy'
    }
    // AspectJ tool binaries (ajc)
    ajcTools {
        canBeConsumed = false
        canBeResolved = true
    }
    // AspectJ runtime (needed on compile & weave CP; also shaded)
    ajcRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
    // External jars for compiling consumer glue. Not the test compile classpath:
    // that includes this project's classes and would cycle through processResources.
    consumerGlueLibs {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom testImplementation
        extendsFrom testCompileOnly
    }
}

dependencies {
    // Shared wire DTOs/constants only. The protocol module is JDK-only and its
    // classes are embedded in the published Pickleball artifact below.
    implementation project(':pickleball-control-protocol')
    implementation project(':dom-engine')

    api("io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}") {
        // Prevent consumers from pulling the UNWOVEN cucumber internals transitively
        exclude group: "io.cucumber", module: "cucumber-core"
        exclude group: "io.cucumber", module: "cucumber-gherkin"
        exclude group: "io.cucumber", module: "cucumber-gherkin-messages"
        exclude group: "io.cucumber", module: "cucumber-java"
        exclude group: "io.cucumber", module: "cucumber-plugin"
        exclude group: "io.cucumber", module: "messages"
        exclude group: "io.cucumber", module: "gherkin"
    }

    api("org.junit.platform:junit-platform-suite-api:1.13.4")
    api("org.junit.platform:junit-platform-suite-engine:1.13.4")
    api("org.junit.platform:junit-platform-launcher:1.13.4")
    api("org.junit.jupiter:junit-jupiter-api:5.13.4")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.13.4")
    testImplementation sourceSets.runnerFixtures.output
    // Consumer glue is compiled for dual-run only. It is not a test source set,
    // so its JUnit checks are not discovered as :test. The output is added on the
    // test task classpath below, not as a testImplementation dependency, or the
    // glue compile classpath would cycle.
    // cucumber-core is excluded from the test runtime so woven classes win.
    // That exclude also drops transitives only cucumber-core requests.
    // datatable and docstring are separate modules. They are not woven, and the
    // cucumber-java exclude drops them unless they are requested directly.
    testRuntimeOnly("io.cucumber:tag-expressions")
    testRuntimeOnly("io.cucumber:datatable:${cucumberVersion}")
    testRuntimeOnly("io.cucumber:docstring:${cucumberVersion}")
    // cucumber-core's other runtime modules. The core jar itself stays excluded
    // so woven classes win. ExpectedFailureRunnerTest launches the real engine.
    testRuntimeOnly("io.cucumber:ci-environment")
    testRuntimeOnly("io.cucumber:cucumber-expressions")
    testRuntimeOnly("io.cucumber:pretty-formatter")
    testRuntimeOnly("io.cucumber:html-formatter")
    testRuntimeOnly("io.cucumber:junit-xml-formatter")
    testRuntimeOnly("io.cucumber:testng-xml-formatter")
    // Logback 1.3 stays on SLF4J 1.7, which this tree already uses.
    // The console-tap test starts a real ConsoleAppender. It is test-only.
    // MCP SDK is Workbench-only. The in-process facade test loads those classes at runtime.
    testRuntimeOnly 'io.modelcontextprotocol.sdk:mcp-core:2.0.0'
    testRuntimeOnly 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.0.0'
    testImplementation("ch.qos.logback:logback-classic:1.3.15")
    testImplementation("org.apache.logging.log4j:log4j-core:2.25.3")

    api("com.google.guava:guava:33.5.0-jre")
    api("com.fasterxml.jackson.core:jackson-databind:2.20.0")
    api("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.0")
    api("com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.0")
    api("com.fasterxml.jackson.datatype:jackson-datatype-guava:2.20.0")
    api("com.googlecode.aviator:aviator:5.4.3")
    api("com.ibm.jsonata4java:JSONata4Java:2.6.0")

    // data formatting
    api 'org.jetbrains:annotations:26.0.2-1'

    // service calls
    implementation ('com.salesforce.revoman:revoman:0.81.0') {
        exclude group: "org.apache.logging.log4j", module: "log4j-slf4j2-impl"
    }
    api('io.rest-assured:rest-assured:6.0.0')

    // JDBC drivers are published as transitive dependencies. They are not shaded.
    // sqlite-jdbc is a published runtime dependency (POM scope runtime) and is
    // still kept out of the consumer shadow JAR.
    implementation 'com.h2database:h2:2.3.232'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.47.2.0'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.47.2.0'
    implementation 'org.postgresql:postgresql:42.7.7'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:12.10.1.jre11'
    implementation 'com.oracle.database.jdbc:ojdbc11:23.7.0.25.01'

    // logging and reports
//    api "com.aventstack:extentreports:5.1.2"
    api 'com.epam.reportportal:client-java:5.4.8'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.25.3'

//    implementation("io.github.classgraph:classgraph:4.8.184")
    implementation("org.apache.poi:poi-ooxml:5.5.1")

    // AspectJ toolchain + runtime
    ajcTools "org.aspectj:aspectjtools:${aspectjVersion}"
    ajcRuntime "org.aspectj:aspectjrt:${aspectjVersion}"
//    implementation "org.aspectj:aspectjrt:${aspectjVersion}" // shaded into pickleball

    // Declare weave targets.
    toWeave.each { gav ->
        weaveLibs  "${gav.group}:${gav.name}:${gav.version}"
        api "${gav.group}:${gav.name}:${gav.version}"
        testImplementation "${gav.group}:${gav.name}:${gav.version}"
    }

    // Align all io.cucumber modules in THIS build, and also share alignment intent with consumers (Gradle)
    api(platform("io.cucumber:cucumber-bom:${cucumberVersion}"))

    // Selenium is browser lifecycle and the pkb_composite=off element path.
    // The embedded Java control engine (project(':dom-engine')) ships in the jar; the vendored dev.domcomposite Client and Session are its stdio client.
    implementation('org.seleniumhq.selenium:selenium-java') {
        version { strictly('[4.44,5.0)') }
    }
    testImplementation('org.seleniumhq.selenium:htmlunit3-driver:4.44.0')

    // D12: Playwright for Java (+ driver-bundle with its bundled Node) is a normal implementation dependency,
    // listed in the published POM and never shaded into pickleball's jar (verifyPlaywrightPackaging).
    // Pinned inside the locked G1 range. Pickleball never downloads Playwright browsers.
    implementation('com.microsoft.playwright:playwright') {
        version { strictly '[1.40.0, 2.0.0)'; prefer '1.65.1' }
    }

    implementation files('libs/xpathy-3.0.0.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('ajcMain', JavaExec) {
    group = 'build'
    description = 'Compile Java + AspectJ (main) with ajc'
    // -classpath is only a string passed to ajc. Gradle does not infer project
    // jars from that string, so a clean checkout never built :dom-engine:jar
    // and DomLogCli could not resolve dev.domengine. Take the compile classpath
    // as a real input and build those jars first. The path is read at execution
    // time, after the jars exist.
    def ajcClasspath = files(sourceSets.main.compileClasspath, configurations.ajcRuntime)
    dependsOn ajcClasspath
    dependsOn ':dom-engine:jar', ':pickleball-control-protocol:jar'

    def outDir = sourceSets.main.java.destinationDirectory
    inputs.files(sourceSets.main.java)
    inputs.files(ajcClasspath)
    outputs.dir(outDir)

    mainClass.set('org.aspectj.tools.ajc.Main')
    classpath = configurations.ajcTools

    def allSourceRoots = sourceSets.main.java.srcDirs
            .collect { it.absolutePath }
            .join(File.pathSeparator)

    doFirst {
        args = [
                '-21',
                '-sourceroots', allSourceRoots,
                '-d', outDir.get().asFile.absolutePath,
                '-classpath', ajcClasspath.asPath,
                '-Xlint:ignore'
        ]
    }
}

// Disable javac—ajc produces the class files
tasks.named('compileJava').configure { enabled = false }
// Make lifecycle compile depend on ajc
tasks.named('classes') { dependsOn 'ajcMain' }

tasks.named('compileRunnerFixturesJava') {
    dependsOn tasks.named('classes')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
}

tasks.named('compileConsumerGlueJava') {
    dependsOn tasks.named('ajcMain')
    dependsOn tasks.named('expandWoven')
    dependsOn ':pickleball-control-api:classes'
    def controlApiClasses = file('pickleball-control-api/build/classes/java/main')
    def woven = layout.buildDirectory.dir('woven-expanded')
    classpath = files(
            sourceSets.main.java.destinationDirectory,
            controlApiClasses,
            woven,
            configurations.consumerGlueLibs
    )
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('compileConsumerGlueJava')
    dependsOn ':pickleball-control-api:classes'
    dependsOn ':pickleball-workbench:classes'
    classpath += sourceSets.consumerGlue.output
    classpath += files('pickleball-control-api/build/classes/java/main')
    classpath += files(rootProject.project(':pickleball-workbench').layout.buildDirectory.dir('classes/java/main'))
}

// --- BINARY WEAVING OF DEPENDENCY JARS ---
def wovenDir = layout.buildDirectory.dir('woven')
def wovenExpanded = layout.buildDirectory.dir('woven-expanded')
def wovenJar = wovenDir.map { it.file("all-woven.jar") }

tasks.register('weaveTargets', JavaExec) {
    group = 'build'
    description = 'Weaves ALL target jars with compiled aspects in one AJC run'
    dependsOn 'ajcMain'

    def classesDir = sourceSets.main.java.destinationDirectory
    inputs.dir(classesDir)
    outputs.file(wovenJar)

    doFirst {
        wovenDir.get().asFile.mkdirs()
    }

    def inpathFiles = provider {
        def wanted = toWeave.collect {
            "${it.group}:${it.name}:${it.version}"
        } as Set

        configurations.weaveLibs.incoming.artifacts.artifacts.findAll { artifact ->
            def component = artifact.id.componentIdentifier
            component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                    "${component.group}:${component.module}:${component.version}" in wanted
        }.collect { it.file }
    }

    mainClass.set('org.aspectj.tools.ajc.Main')
    classpath = configurations.ajcTools

    def classesDirFile = classesDir.get().asFile
    def weaverClasspath = files(
            configurations.weaveLibs,
            configurations.ajcRuntime,
            classesDirFile
    ).asPath

    args = [
            '-showWeaveInfo',
            '-verbose',
            '-Xlint:warning',
            '-inpath', files(inpathFiles).asPath,
            '-aspectpath', files(classesDirFile).asPath,
            '-classpath', weaverClasspath,
            '-outjar', wovenJar.get().asFile.absolutePath
    ]
}

tasks.register('expandWoven') {
    group = 'build'
    description = 'Expands woven jar into a staging directory for shading'
    dependsOn 'weaveTargets'

    inputs.file(wovenJar)
    outputs.dir(wovenExpanded)

    doLast {
        def jar = wovenJar.get().asFile
        if (!jar.exists()) {
            throw new GradleException("Expected woven jar was not created: ${jar}")
        }

        copy {
            into(wovenExpanded)
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE

            from(zipTree(jar)) {
                exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
                exclude 'META-INF/MANIFEST.MF'
            }
        }
    }
}

def myLicense = file("LICENSE").canonicalFile
def myNotice  = file("NOTICE").canonicalFile
def embeddedWorkbenchResource = 'META-INF/pickleball/workbench/pickleball-workbench.jar'
def standaloneWorkbenchJar = project(':pickleball-workbench').layout.buildDirectory.file(
        "libs/pickleball-workbench-${project.version}.jar"
)

tasks.shadowJar {
    configurations = [project.configurations.ajcRuntime]

    // Preserve the existing first-entry-wins behavior generally, but allow
    // duplicate Java service descriptors through so Shadow can merge them.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    // Exclude LICENSE/NOTICE coming from dependency jars, but keep project ones.
    exclude { FileTreeElement e ->
        def p = e.path
        boolean looksLikeLicenseOrNotice =
                p == 'LICENSE' ||
                        p == 'NOTICE' ||
                        p.startsWith('META-INF/LICENSE') ||
                        p.startsWith('META-INF/NOTICE') ||
                        p ==~ /(?i)^LICENSE(\..+)?$/ ||
                        p ==~ /(?i)^NOTICE(\..+)?$/ ||
                        p ==~ /(?i)^META-INF\/LICENSE(\..+)?$/ ||
                        p ==~ /(?i)^META-INF\/NOTICE(\..+)?$/

        if (!looksLikeLicenseOrNotice) return false

        File src = e.file
        if (src != null && src.exists()) {
            def c = src.canonicalFile
            if (c == myLicense || c == myNotice) return false
        }

        return true
    }

    from("LICENSE") { into "META-INF" }
    from("NOTICE") { into "META-INF" }
    from("THIRD-PARTY-NOTICES.md") { into "META-INF" }

    dependsOn 'ajcMain', 'expandWoven', 'classes', ':pickleball-workbench:shadowJar', ':dom-engine:jar'

    // from(sourceSets.main.output) did not embed dev.domengine. Zip the module jar instead.
    from({ zipTree(project(':dom-engine').tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }

    archiveBaseName.set('pickleball')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('')

    manifest {
        attributes(
                'Implementation-Title': 'Pickleball',
                'Implementation-Version': project.version.toString(),
                'Pickleball-Workbench-Resource': embeddedWorkbenchResource,
                'Main-Class': 'tools.dscode.launcher.PickleballWorkbenchLauncher'
        )
    }

    from(sourceSets.main.output) {
        includeEmptyDirs = false
    }

    // Bundle local xpathy jar into the shaded jar.
    from({ zipTree(file("libs/xpathy-3.0.0.jar")) }) {
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        exclude 'META-INF/MANIFEST.MF'
    }

    // put woven classes LAST so they overwrite any originals
    from(wovenExpanded)

    // Workbench is delivered outward as one opaque controller-only executable.
    // Never expand this payload into the consumer-visible runtime namespace.
    from(standaloneWorkbenchJar) {
        into 'META-INF/pickleball/workbench'
        rename { 'pickleball-workbench.jar' }
    }

    mergeServiceFiles()

    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    zip64 = true
}

tasks.register('engineRun', JavaExec) {
    group = 'engine'
    description = 'Forward to the engine CLI. sqlite-jdbc stays on this task classpath because DiagnosticIndexRebuilder can rebuild the diagnostic FTS index from an engine run (design section 13). runtimeClasspath already includes it; the explicit dependency keeps the driver on the task if that configuration changes.'
    classpath = sourceSets.main.runtimeClasspath + configurations.detachedConfiguration(
            dependencies.create('org.xerial:sqlite-jdbc:3.47.2.0')
    )
    mainClass = 'tools.dscode.engine.EngineCli'
    args = ['engine', 'run']
    if (project.hasProperty('engineText')) args += ['--text=' + project.property('engineText')]
    if (project.hasProperty('engineFile')) args += ['--file=' + project.property('engineFile')]
    if (project.hasProperty('engineSteps')) args += ['--steps=' + project.property('engineSteps')]
    if (project.hasProperty('engineGlue')) args += ['--glue=' + project.property('engineGlue')]
    if (project.hasProperty('engineName')) args += ['--name=' + project.property('engineName')]
    if (project.hasProperty('engineStore')) args += ['--store']
    if (project.hasProperty('engineFeature')) args += ['--feature=' + project.property('engineFeature')]
}

def storeForwardClasspath = sourceSets.main.runtimeClasspath
// A store* task is itself a project property. -Pstoresomething must come from Gradle properties,
// never project.hasProperty, or the task name is forwarded as the command.
def storeProp = { String key -> providers.gradleProperty(key) }

tasks.register('storeStatus', JavaExec) {
    group = 'store'
    description = 'Forward to the Store CLI status command. The store driver is already on the runtime classpath.'
    classpath = storeForwardClasspath
    mainClass = 'tools.dscode.store.StoreCli'
    args = ['store', 'status']
    if (storeProp('storeSandbox').isPresent()) args += ['--sandbox=' + storeProp('storeSandbox').get()]
}

tasks.register('storeHydrate', JavaExec) {
    group = 'store'
    description = 'Forward to the Store CLI hydrate command. The store driver is already on the runtime classpath.'
    classpath = storeForwardClasspath
    mainClass = 'tools.dscode.store.StoreCli'
    args = ['store', 'hydrate']
    if (storeProp('storePath').isPresent()) args += ['--path=' + storeProp('storePath').get()]
    if (storeProp('storeForce').isPresent()) args += ['--force']
    if (storeProp('storeSandbox').isPresent()) args += ['--sandbox=' + storeProp('storeSandbox').get()]
}

tasks.register('storeExtract', JavaExec) {
    group = 'store'
    description = 'Forward to the Store CLI extract command. The store driver is already on the runtime classpath.'
    classpath = storeForwardClasspath
    mainClass = 'tools.dscode.store.StoreCli'
    args = ['store', 'extract']
    if (storeProp('storePath').isPresent()) args += ['--path=' + storeProp('storePath').get()]
    if (storeProp('storeForce').isPresent()) args += ['--force']
    if (storeProp('storeSandbox').isPresent()) args += ['--sandbox=' + storeProp('storeSandbox').get()]
}

tasks.register('storeFeature', JavaExec) {
    group = 'store'
    description = 'Forward to the Store CLI feature command. The store driver is already on the runtime classpath.'
    classpath = storeForwardClasspath
    mainClass = 'tools.dscode.store.StoreCli'
    args = ['store', 'feature']
    args += [storeProp('storeFeature').orElse('put').get()]
    if (storeProp('storePath').isPresent()) args += [storeProp('storePath').get()]
    if (storeProp('storeText').isPresent()) args += ['--text=' + storeProp('storeText').get()]
    if (storeProp('storeFile').isPresent()) args += ['--file=' + storeProp('storeFile').get()]
    if (storeProp('storeSandbox').isPresent()) args += ['--sandbox=' + storeProp('storeSandbox').get()]
}

tasks.register('storeEdit', JavaExec) {
    group = 'store'
    description = 'Forward to the Store edit CLI (category, file, glue, feature scenario/step). The store driver is already on the runtime classpath.'
    classpath = storeForwardClasspath
    mainClass = 'tools.dscode.store.StoreCli'
    args = ['store']
    def editArgs = storeProp('storeArgs').orElse('category,list').get()
    editArgs.split(',').each { piece ->
        def trimmed = piece == null ? '' : piece.toString().trim()
        if (!trimmed.isEmpty()) args += [trimmed]
    }
    if (storeProp('storeJson').isPresent()) args += ['--json']
    if (storeProp('storePath').isPresent()) args += ['--path=' + storeProp('storePath').get()]
    if (storeProp('storeId').isPresent()) args += ['--id=' + storeProp('storeId').get()]
    if (storeProp('storeText').isPresent()) args += ['--text=' + storeProp('storeText').get()]
    if (storeProp('storeFile').isPresent()) args += ['--file=' + storeProp('storeFile').get()]
    if (storeProp('storeConfirm').isPresent()) args += ['--confirm']
    if (storeProp('storeForce').isPresent()) args += ['--force']
    if (storeProp('storeSandbox').isPresent()) args += ['--sandbox=' + storeProp('storeSandbox').get()]
}

tasks.register('domengine', JavaExec) {
    group = 'domengine'
    description = 'Forward arguments to the pickleball domengine CLI. Does not publish a dom-engine artifact.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tools.dscode.launcher.PickleballWorkbenchLauncher'
    def engineArgs = project.hasProperty('domengineArgs') ? project.property('domengineArgs').toString() : 'version'
    def forwarded = ['domengine']
    engineArgs.split(',').each { piece ->
        def trimmed = piece == null ? '' : piece.toString().trim()
        if (!trimmed.isEmpty()) forwarded.add(trimmed)
    }
    args(forwarded)
}

tasks.register('storeQuery', JavaExec) {
    group = 'store'
    description = 'Forward to a Store CLI read command. The store driver is already on the runtime classpath.'
    classpath = storeForwardClasspath
    mainClass = 'tools.dscode.store.StoreCli'
    args = ['store']
    def queryArgs = storeProp('storeArgs').orElse('files,list').get()
    queryArgs.split(',').each { piece ->
        def trimmed = piece == null ? '' : piece.toString().trim()
        if (!trimmed.isEmpty()) args += [trimmed]
    }
    if (storeProp('storeJson').isPresent()) args += ['--json']
    if (storeProp('storeFeaturePath').isPresent()) args += ['--feature=' + storeProp('storeFeaturePath').get()]
    if (storeProp('storeScenario').isPresent()) args += ['--scenario=' + storeProp('storeScenario').get()]
    if (storeProp('storeSince').isPresent()) args += ['--since=' + storeProp('storeSince').get()]
    if (storeProp('storeTable').isPresent()) args += ['--table=' + storeProp('storeTable').get()]
    if (storeProp('storeLimit').isPresent()) args += ['--limit=' + storeProp('storeLimit').get()]
    if (storeProp('storeSandbox').isPresent()) args += ['--sandbox=' + storeProp('storeSandbox').get()]
}

tasks.register('storeHistory', JavaExec) {
    group = 'store'
    description = 'Forward to the Store CLI history command. The store driver is already on the runtime classpath.'
    classpath = storeForwardClasspath
    mainClass = 'tools.dscode.store.StoreCli'
    args = ['store', 'history']
    args += [storeProp('storeHistory').orElse('list').get()]
    if (storeProp('storeRun').isPresent()) args += [storeProp('storeRun').get()]
    if (storeProp('storeDays').isPresent()) args += ['--days=' + storeProp('storeDays').get()]
    if (storeProp('storeMaxBytes').isPresent()) args += ['--max-bytes=' + storeProp('storeMaxBytes').get()]
    if (storeProp('storeSandbox').isPresent()) args += ['--sandbox=' + storeProp('storeSandbox').get()]
}

tasks.register('storeRun', JavaExec) {
    group = 'store'
    description = 'Forward to the Store CLI run command.'
    classpath = storeForwardClasspath
    mainClass = 'tools.dscode.store.StoreCli'
