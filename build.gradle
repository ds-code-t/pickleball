tasks.register('verifyEmbeddedWorkbench') {
    group = 'verification'
    description = 'Verifies the outer Pickleball JAR embeds exactly the controller-only Workbench payload.'
    dependsOn tasks.shadowJar, ':pickleball-workbench:verifyWorkbenchArtifact'

    doLast {
        File outerFile = tasks.named('shadowJar').get().archiveFile.get().asFile
        File standaloneFile = standaloneWorkbenchJar.get().asFile
        def sha256 = { InputStream input ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            byte[] buf = new byte[65536]
            int read
            while ((read = input.read(buf)) >= 0) {
                digest.update(buf, 0, read)
            }
            digest.digest()
        }

        new java.util.jar.JarFile(outerFile).withCloseable { outer ->
            def payloadEntries = java.util.Collections.list(outer.entries()).findAll { entry ->
                !entry.directory && entry.name.startsWith('META-INF/pickleball/workbench/')
            }
            if (payloadEntries*.name != [embeddedWorkbenchResource]) {
                throw new GradleException(
                        "Expected exactly one opaque Workbench payload at ${embeddedWorkbenchResource}: " +
                                payloadEntries*.name
                )
            }

            byte[] standaloneHash
            standaloneFile.withInputStream { input ->
                standaloneHash = sha256(input)
            }
            byte[] embeddedHash
            outer.getInputStream(payloadEntries.first()).withCloseable { input ->
                embeddedHash = sha256(input)
            }
            if (!java.util.Arrays.equals(standaloneHash, embeddedHash)) {
                throw new GradleException(
                        'Embedded Workbench payload bytes do not match the standalone controller build.'
                )
            }

            def flattened = java.util.Collections.list(outer.entries()).findAll { entry ->
                entry.name.startsWith('tools/dscode/workbench/') ||
                        entry.name.startsWith('io/modelcontextprotocol/') ||
                        entry.name.startsWith('javafx/') ||
                        entry.name.startsWith('javafx-natives/')
            }
            if (!flattened.isEmpty()) {
                throw new GradleException(
                        'Workbench/controller dependencies were flattened into Pickleball: ' +
                                flattened*.name.take(20)
                )
            }

            new java.util.jar.JarFile(standaloneFile).withCloseable { nested ->
                def mainClass = nested.manifest?.mainAttributes?.getValue('Main-Class')
                if (mainClass != 'tools.dscode.workbench.WorkbenchApplication') {
                    throw new GradleException('Embedded Workbench payload has an unexpected Main-Class.')
                }
            }

            def outerMain = outer.manifest?.mainAttributes?.getValue('Main-Class')
            if (outerMain != 'tools.dscode.launcher.PickleballWorkbenchLauncher') {
                throw new GradleException(
                        'Outer Pickleball JAR Main-Class must be PickleballWorkbenchLauncher so java -jar can extract and fork Workbench: ' +
                                outerMain
                )
            }
        }
    }
}

