tasks.register('verifySqlitePackaging') {
    group = 'verification'
    description = 'sqlite-jdbc is a runtime POM dependency and is not inside the consumer shadow JAR.'
    dependsOn tasks.named('generatePomFileForMavenPublication'), tasks.named('shadowJar')
    doLast {
        def childText = { org.w3c.dom.Node parent, String name ->
            def children = parent.getChildNodes()
            for (int c = 0; c < children.getLength(); c++) {
                def child = children.item(c)
                if (child.getNodeType() == org.w3c.dom.Node.ELEMENT_NODE && child.getNodeName() == name) {
                    return child.getTextContent().trim()
                }
            }
            return ''
        }
        def pomFile = layout.buildDirectory.file('publications/maven/pom-default.xml').get().asFile
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setNamespaceAware(false)
        factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        def doc = factory.newDocumentBuilder().parse(pomFile)
        def nodes = doc.getElementsByTagName('dependency')
        def hits = []
        for (int i = 0; i < nodes.getLength(); i++) {
            def node = nodes.item(i)
            def group = childText(node, 'groupId')
            def artifact = childText(node, 'artifactId')
            if (group == 'org.xerial' && artifact == 'sqlite-jdbc') {
                hits.add([version: childText(node, 'version'), scope: childText(node, 'scope')])
            }
        }
        if (hits.size() != 1) {
            throw new GradleException('Published Pickleball POM must contain exactly one org.xerial:sqlite-jdbc dependency, found ' + hits.size())
        }
        def version = hits[0].version
        def scope = hits[0].scope
        if (version != '3.47.2.0' || scope != 'runtime') {
            throw new GradleException('sqlite-jdbc must be version 3.47.2.0 scope runtime, was ' + version + ' ' + scope)
        }
        def jar = tasks.named('shadowJar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jar)
        try {
            def hit = zip.entries().find { entry ->
                entry.name.startsWith('org/sqlite/') || entry.name.contains('sqlite-jdbc')
            }
            if (hit != null) {
                throw new GradleException('Consumer shadow JAR must not ship sqlite-jdbc: ' + hit.name)
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifyPlaywrightPackaging') {
    group = 'verification'
    description = 'Playwright is a POM dependency and is not inside the consumer shadow JAR (D12).'
    dependsOn tasks.named('generatePomFileForMavenPublication'), tasks.named('shadowJar')
    doLast {
        def pomFile = layout.buildDirectory.file('publications/maven/pom-default.xml').get().asFile
        def pom = pomFile.text
        ['playwright', 'driver-bundle', 'driver'].each { artifact ->
            if (!(pom =~ /<groupId>com\.microsoft\.playwright<\/groupId>\s*<artifactId>${artifact}<\/artifactId>/)) {
                throw new GradleException('Published Pickleball POM must list com.microsoft.playwright:' + artifact)
            }
        }
        def jar = tasks.named('shadowJar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jar)
        try {
            def hit = zip.entries().find { entry ->
                entry.name.startsWith('com/microsoft/playwright/') || entry.name.startsWith('driver/')
                        || entry.name.contains('playwright-driver') || entry.name.contains('driver-bundle')
            }
            if (hit != null) {
                throw new GradleException('Consumer shadow JAR must not ship Playwright or its driver bundle: ' + hit.name)
            }
        } finally {
            zip.close()
        }
    }
}

