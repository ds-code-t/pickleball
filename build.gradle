    }
}

// -Ppkb.test.forks sets maxParallelForks on every Test task. Default 1 so CI
// stays one worker. The ceiling stays high enough for SuiteDualRunTest and
// live Chrome. minHeapSize is what a light worker reserves. SerialGC plus the
// free-ratio flags return heap a light class does not need. Code cache
// reservation is 32m so 80 forks fit in 64 GB beside the 768m Gradle JVM.
def pkbTestForksRaw = findProperty('pkb.test.forks')
int pkbTestForks
if (pkbTestForksRaw == null || pkbTestForksRaw.toString().trim().isEmpty()) {
    pkbTestForks = 1
} else {
    try {
        pkbTestForks = Integer.parseInt(pkbTestForksRaw.toString().trim())
    } catch (NumberFormatException ignored) {
        throw new GradleException("pkb.test.forks must be an integer, was '${pkbTestForksRaw}'")
    }
    if (pkbTestForks < 1) {
        throw new GradleException("pkb.test.forks must be >= 1, was ${pkbTestForks}")
    }
}

// -Ppkb.test.liveForks is maxParallelForks for :testLive only. Default 1.
// The 60 live/contention classes must not inherit -Ppkb.test.forks.
def pkbTestLiveForksRaw = findProperty('pkb.test.liveForks')
int pkbTestLiveForks
if (pkbTestLiveForksRaw == null || pkbTestLiveForksRaw.toString().trim().isEmpty()) {
    pkbTestLiveForks = 1
} else {
    try {
        pkbTestLiveForks = Integer.parseInt(pkbTestLiveForksRaw.toString().trim())
    } catch (NumberFormatException ignored) {
        throw new GradleException("pkb.test.liveForks must be an integer, was '${pkbTestLiveForksRaw}'")
    }
    if (pkbTestLiveForks < 1) {
        throw new GradleException("pkb.test.liveForks must be >= 1, was ${pkbTestLiveForks}")
    }
}

allprojects {
    tasks.withType(Test).configureEach { task ->
        def liveRoot = (task.project.path == ':' && task.name == 'testLive')
        task.maxParallelForks = liveRoot ? pkbTestLiveForks : pkbTestForks
        task.minHeapSize = '64m'
        def heavyModule = task.project.path == ':' || task.project.path == ':dom-engine'
        task.maxHeapSize = heavyModule ? '1536m' : '768m'
        task.systemProperty('pkb.test.forks', Integer.toString(pkbTestForks))
        task.systemProperty('pkb.test.liveForks', Integer.toString(pkbTestLiveForks))
        task.systemProperty('pkb.test.maxHeap', task.maxHeapSize)
        def lockDir = task.project.layout.buildDirectory.dir('pkb-test-locks')
        task.systemProperty('pkb.test.lockDir', lockDir.get().asFile.absolutePath)
        task.jvmArgs(
                '-XX:+UseSerialGC',
                '-XX:MinHeapFreeRatio=10',
                '-XX:MaxHeapFreeRatio=20',
                '-XX:MaxMetaspaceSize=384m',
                '-XX:ReservedCodeCacheSize=32m',
                '-Xss384k',
                '-XX:MaxDirectMemorySize=64m',
                '-Dpkb.test.console.cap=on',
                '-Dpkb.test.console.forward.bytes=262144',
                '-Dpkb.test.console.file.bytes=4194304'
        )
        if (System.getProperty('pkb.update.golden') == 'true') {
            task.systemProperty('pkb.update.golden', 'true')
        }
        if (System.getProperty('pkb.update.verb-inventory') == 'true') {
            task.systemProperty('pkb.update.verb-inventory', 'true')
        }
        def consoleDir = task.project.layout.buildDirectory.dir("test-console/${task.name}")
        task.systemProperty('pkb.test.console.dir', consoleDir.get().asFile.absolutePath)
        task.doFirst {
            consoleDir.get().asFile.mkdirs()
            if (task.project.path == ':' && task.name == 'testLive') {
                logger.lifecycle("pkb.test.liveForks ${task.path} maxParallelForks=${task.maxParallelForks} maxHeap=${task.maxHeapSize} minHeap=${task.minHeapSize}")
            } else {
                logger.lifecycle("pkb.test.forks ${task.path} maxParallelForks=${task.maxParallelForks} maxHeap=${task.maxHeapSize} minHeap=${task.minHeapSize}")
            }
        }
    }
}

// Last writer: a module Test block must not pin maxParallelForks back to 1.
gradle.projectsEvaluated {
    allprojects { project ->
        project.tasks.withType(Test).configureEach { task ->
            def liveRoot = (task.project.path == ':' && task.name == 'testLive')
            task.maxParallelForks = liveRoot ? pkbTestLiveForks : pkbTestForks
            task.minHeapSize = '64m'
            def heavyModule = task.project.path == ':' || task.project.path == ':dom-engine'
            task.maxHeapSize = heavyModule ? '1536m' : '768m'
        }
    }
}

// Parallel-unsafe live group. After :test, before :testSerial, at
// -Ppkb.test.liveForks (default 1). Serial group stays one class after that
// so port 8765 and the repo calls link are not shared with other workers.
def suiteDualRunClass = 'tools.dscode.engine.parity.SuiteDualRunTest'
def suiteDualRunSimple = 'SuiteDualRunTest'


def pkbGlob = { String pattern, String text ->
    if (pattern == null || text == null) return false
    StringBuilder regex = new StringBuilder('^')
    for (int i = 0; i < pattern.length(); i++) {
        char ch = pattern.charAt(i)
        if (ch == '*') regex.append('.*')
        else regex.append(java.util.regex.Pattern.quote(String.valueOf(ch)))
    }
    regex.append('$')
    return text.matches(regex.toString())
}

def pkbClassMatches = { String pattern, String fqcn, String simple ->
    if (pattern == null || pattern.isBlank() || fqcn == null) return false
    if (pkbGlob(pattern, fqcn) || (simple != null && pkbGlob(pattern, simple))) return true
    if (pattern.startsWith(fqcn + '.') || (simple != null && pattern.startsWith(simple + '.'))) return true
    int dot = pattern.lastIndexOf('.')
    if (dot <= 0) return false
    String head = pattern.substring(0, dot)
    return pkbGlob(head, fqcn) || (simple != null && pkbGlob(head, simple))
}

def suiteDualRunMatches = { String pattern ->
    return pkbClassMatches(pattern, suiteDualRunClass, suiteDualRunSimple)
}

def pkbLiveMatches = { String pattern ->
    return pkbLiveTestClasses.any { String fqcn ->
        pkbClassMatches(pattern, fqcn, fqcn.substring(fqcn.lastIndexOf('.') + 1))
    }
}

def pkbExclusiveLiveOrSerial = { String pattern ->
    if (pattern == null || pattern.isBlank()) return false
    if (suiteDualRunMatches(pattern) && !pattern.contains('*')) return true
    return pkbLiveTestClasses.any { String fqcn ->
        String simple = fqcn.substring(fqcn.lastIndexOf('.') + 1)
        if (pattern.contains('*')) return false
        return pkbClassMatches(pattern, fqcn, simple)
    }
}

tasks.register('testLive', Test) {
    group = 'verification'
    description = 'Parallel-unsafe live/contention classes (60). Runs after :test at -Ppkb.test.liveForks (default 1).'
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }
    pkbLiveTestClasses.each { String fqcn ->
        include '**/' + fqcn.substring(fqcn.lastIndexOf('.') + 1) + '.class'
    }
    dependsOn 'expandWoven', 'publishToMavenLocal', 'compileConsumerGlueJava', ':pickleball-control-api:classes', ':pickleball-workbench:classes'
    dependsOn tasks.named('shadowJar'), tasks.named('sourcesJar')
    dependsOn tasks.named('verifyPlaywrightPackaging'), tasks.named('verifySqlitePackaging')
    shouldRunAfter tasks.named('test')
    mustRunAfter tasks.named('test')
}

tasks.register('testSerial', Test) {
    group = 'verification'
    description = 'Serial group. SuiteDualRunTest binds port 8765, links src/test/resources/calls, and hydrates this repo store. Runs after :testLive.'
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }
    include '**/SuiteDualRunTest.class'
    dependsOn 'expandWoven', 'publishToMavenLocal', 'compileConsumerGlueJava', ':pickleball-control-api:classes', ':pickleball-workbench:classes'
    dependsOn tasks.named('shadowJar'), tasks.named('sourcesJar')
    shouldRunAfter tasks.named('test'), tasks.named('testLive')
    mustRunAfter tasks.named('test'), tasks.named('testLive')
}

def pkbTestTask = tasks.named('test', Test)
def pkbLiveTask = tasks.named('testLive', Test)
def pkbSerialTask = tasks.named('testSerial', Test)
pkbLiveTask.configure {
    testClassesDirs = pkbTestTask.get().testClassesDirs
    classpath = pkbTestTask.get().classpath
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showCauses true
        showStackTraces true
    }
}
pkbSerialTask.configure {
    testClassesDirs = pkbTestTask.get().testClassesDirs
    classpath = pkbTestTask.get().classpath
}
pkbTestTask.configure {
    finalizedBy pkbLiveTask
}
pkbLiveTask.configure {
    finalizedBy pkbSerialTask
}

tasks.named('check') {
    dependsOn pkbLiveTask, pkbSerialTask
}

gradle.taskGraph.whenReady { graph ->
    def live = pkbLiveTask.get()
    def serial = pkbSerialTask.get()
    def main = pkbTestTask.get()
    def patterns = new LinkedHashSet<String>()
    for (def task : [main, live, serial]) {
        def taskPatterns = task.filter.commandLineIncludePatterns
        if (taskPatterns != null) patterns.addAll(taskPatterns)
    }
    if (patterns.isEmpty()) {
        logger.lifecycle('testLive running the 60 live/contention classes after :test')
        logger.lifecycle('testSerial running SuiteDualRunTest after :testLive')
        return
    }
    boolean wantLive = patterns.any { pkbLiveMatches(it) }
    boolean wantSerial = patterns.any { suiteDualRunMatches(it) }
    boolean wantMain = patterns.any { !pkbExclusiveLiveOrSerial(it) }
    if (!wantLive && graph.hasTask(live)) {
        live.enabled = false
        logger.lifecycle('testLive skipped; --tests does not include a live/contention class')
    } else if (wantLive) {
        live.filter.setCommandLineIncludePatterns(new ArrayList<String>(patterns))
        logger.lifecycle("testLive include ${patterns}")
    }
    if (!wantSerial && graph.hasTask(serial)) {
        serial.enabled = false
        logger.lifecycle('testSerial skipped; --tests does not include SuiteDualRunTest')
    } else if (wantSerial) {
        serial.filter.setCommandLineIncludePatterns(new ArrayList<String>(patterns))
        logger.lifecycle("testSerial include ${patterns}")
    }
    if (!wantMain && graph.hasTask(main)) {
        main.enabled = false
        logger.lifecycle('test skipped; --tests is only a live/contention or SuiteDualRunTest class')
    }
}

// workbenchUi depends on ajcMain, not classes: classes depends on processResources.
def workbenchUiOut = layout.buildDirectory.dir('generated/workbench-ui')

tasks.register('workbenchUi', JavaExec) {
    group = 'build'
    description = 'Copy the workbench renderer into META-INF/pickleball/workbench-ui. npm ci runs when the lockfile lists packages.'
    dependsOn tasks.named('ajcMain')
    classpath = files(sourceSets.main.java.destinationDirectory) + sourceSets.main.compileClasspath
    mainClass = 'tools.dscode.launcher.WorkbenchUiPackager'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    workingDir = layout.projectDirectory.asFile
    args layout.projectDirectory.asFile.absolutePath, workbenchUiOut.get().asFile.absolutePath, gradle.gradleUserHomeDir.absolutePath
    def npmRegistry = System.getProperty('pkb_npm_registry')
    if (npmRegistry) systemProperty 'pkb_npm_registry', npmRegistry
    def npmRegistryEnv = System.getenv('PKB_NPM_REGISTRY')
    if (npmRegistryEnv) environment 'PKB_NPM_REGISTRY', npmRegistryEnv
    inputs.files(fileTree('workbench-ui') {
        exclude 'node_modules/**'
    })
    outputs.dir(workbenchUiOut)
}

tasks.named('processResources').configure {
    dependsOn tasks.named('workbenchUi')
    from(workbenchUiOut)
}

