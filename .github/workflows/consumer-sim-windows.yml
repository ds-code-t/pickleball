name: Consumer simulation (Windows)

on:
  pull_request:
  push:
    branches:
      - master
      - 2.1.18
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish and run the consumer-simulation harness
        shell: pwsh
        run: |
          .\gradlew.bat publishToMavenLocal -x test --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\consumer_sim.ps1
          exit $LASTEXITCODE
