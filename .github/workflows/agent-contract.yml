name: Agent Contract and Consumer Validation

on:
  pull_request:
  push:
    branches:
      - master
      - 2.2.0
      - 3.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify agent contract
        shell: bash
        env:
          STRICT: ${{ vars.AGENT_CONTRACT_STRICT }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: |
          args=(--base-ref "origin/${BASE_REF}")
          if [[ "${STRICT}" == "true" ]]; then
            args+=(--strict)
          fi
          python scripts/verify_agent_contract.py "${args[@]}"

      - name: Verify generated repository index
        shell: bash
        run: python scripts/refresh_agent_index.py --check

      - name: Publish and run the consumer-simulation harness
        shell: pwsh
        run: |
          .\gradlew.bat publishToMavenLocal -x test --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # consumer_sim.py runs the documented mvnw.cmd exec:java line in Windows PowerShell and asserts exit 2.
          .\scripts\consumer_sim.ps1
          exit $LASTEXITCODE

  dom-engine-live:
    name: Java DOM live Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          url="$(python3 - <<'PY'
          import json, urllib.request
          data = json.load(urllib.request.urlopen("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"))
          downloads = data["channels"]["Stable"]["downloads"]["chrome"]
          print(next(item["url"] for item in downloads if item["platform"] == "linux64"))
          PY
          )"
          curl -fsSL -o /tmp/chrome-linux64.zip "$url"
          unzip -q /tmp/chrome-linux64.zip -d "$RUNNER_TEMP/chrome"
          echo "DOMENGINE_CHROME=$RUNNER_TEMP/chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/chrome/chrome-linux64/chrome" --version

      - name: DOM engine tests including live Chrome
        run: ./gradlew --no-daemon :dom-engine:test

      - name: Unjoined-driver repro tests
        run: ./gradlew --no-daemon :test --tests tools.dscode.common.composite.ContextAnchorReproTest --tests tools.dscode.common.domoperations.NestAnchorReproTest

  gate:
    needs: [windows]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Block the release unless Windows passed
        shell: bash
        run: test "${{ needs.windows.result }}" = "success"
