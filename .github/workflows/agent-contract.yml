name: Agent Contract and Consumer Validation

on:
  pull_request:
  push:
    branches:
      - master
      - 2.2.0
      - 3.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify agent contract
        shell: bash
        env:
          STRICT: ${{ vars.AGENT_CONTRACT_STRICT }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: |
          args=(--base-ref "origin/${BASE_REF}")
          if [[ "${STRICT}" == "true" ]]; then
            args+=(--strict)
          fi
          python scripts/verify_agent_contract.py "${args[@]}"

      - name: Verify generated repository index
        shell: bash
        run: python scripts/refresh_agent_index.py --check

      - name: Publish and run the consumer-simulation harness
        shell: pwsh
        run: |
          .\gradlew.bat publishToMavenLocal -x test --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # consumer_sim.py runs the documented mvnw.cmd exec:java line in Windows PowerShell and asserts exit 2.
          .\scripts\consumer_sim.ps1
          exit $LASTEXITCODE

  dom-engine-live:
    name: Java DOM live Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          meta="$(python3 - <<'PY'
          import json, urllib.request
          data = json.load(urllib.request.urlopen("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"))
          stable = data["channels"]["Stable"]
          def url(kind):
              return next(item["url"] for item in stable["downloads"][kind] if item["platform"] == "linux64")
          print(stable["version"])
          print(url("chrome"))
          print(url("chromedriver"))
          PY
          )"
          version="$(printf '%s\n' "$meta" | sed -n '1p')"
          url="$(printf '%s\n' "$meta" | sed -n '2p')"
          driver="$(printf '%s\n' "$meta" | sed -n '3p')"
          curl -fsSL -o /tmp/chrome-linux64.zip "$url"
          unzip -q /tmp/chrome-linux64.zip -d "$RUNNER_TEMP/chrome"
          curl -fsSL -o /tmp/chromedriver-linux64.zip "$driver"
          unzip -q /tmp/chromedriver-linux64.zip -d "$RUNNER_TEMP/chrome"
          chrome="$RUNNER_TEMP/chrome/chrome-linux64/chrome"
          bindir="$RUNNER_TEMP/chrome/bin"
          mkdir -p "$bindir"
          ln -sfn "$chrome" "$bindir/google-chrome"
          ln -sfn "$chrome" "$bindir/google-chrome-stable"
          ln -sfn "$chrome" "$bindir/chrome"
          ln -sfn "$RUNNER_TEMP/chrome/chromedriver-linux64/chromedriver" "$bindir/chromedriver"
          echo "DOMENGINE_CHROME=$chrome" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "CHROME_TEST_BIN=$bindir" >> "$GITHUB_ENV"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/google-chrome" --version
          "$bindir/chromedriver" --version
          echo "chrome-for-testing $version"

      - name: DOM engine tests including live Chrome
        run: |
          set +e
          ./gradlew --no-daemon :dom-engine:test
          code=$?
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path("dom-engine/build/test-results/test").glob("TEST-dev.domengine.snapshot.LiveEdgeSnapshotTest.xml"))
          if not reports:
              print("LiveEdgeSnapshotTest: no result")
          else:
              cases = ET.parse(reports[0]).getroot().findall("testcase")
              ran = skipped = failed = 0
              notes = []
              for case in cases:
                  name = case.attrib.get("name", "")
                  skip = case.find("skipped")
                  if skip is not None:
                      skipped += 1
                      message = (skip.attrib.get("message") or "").strip()
                      notes.append(name + (": " + message if message else ""))
                  elif case.find("failure") is not None or case.find("error") is not None:
                      failed += 1
                      notes.append(name + ": failed")
                  else:
                      ran += 1
              detail = ("; " + "; ".join(notes)) if notes else ""
              print(f"LiveEdgeSnapshotTest: ran {ran}, skipped {skipped}, failed {failed}{detail}")
          PY
          exit "$code"

      - name: Workbench direct-control attach on the Java engine
        run: ./gradlew --no-daemon :pickleball-control-protocol:test --tests tools.dscode.control.protocol.DirectControlProviderTest

      - name: Unjoined-driver repro tests
        run: ./gradlew --no-daemon :test --tests tools.dscode.common.composite.ContextAnchorReproTest --tests tools.dscode.common.domoperations.NestAnchorReproTest

      - name: Java engine adapter live tests
        run: ./gradlew --no-daemon :test --tests tools.dscode.common.composite.live.*

      - name: Consumer @dom-composite on native and cucumber
        run: |
          set -euo pipefail
          if [ -n "${CHROME_TEST_BIN:-}" ]; then
            PATH="$(printf '%s\n' "$PATH" | tr ':' '\n' | grep -vxF "$CHROME_TEST_BIN" | paste -sd: -)"
            export PATH
          fi
          ./gradlew --no-daemon publishToMavenLocal -x test
          cd maven-consumer-project
          mvn -B test -Dpkb_tags=@dom-composite -Dpkb_engine=native -Dpkb_runvars.pkb_browser=CHROME_HEADLESS
          mvn -B test -Dpkb_tags=@dom-composite -Dpkb_engine=cucumber -Dpkb_runvars.pkb_browser=CHROME_HEADLESS

  gate:
    needs: [windows, dom-engine-live]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Block the release unless Windows and live Chrome passed
        shell: bash
        run: |
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.dom-engine-live.result }}" = "success"
