name: Agent Contract and Consumer Validation

on:
  pull_request:
  push:
    branches:
      - master
      - 2.2.0
      - 3.0.0
      - 3.0.0-embedded-store
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Embedded store spike
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.spike.EmbeddedStoreSpikeTest \
            --tests tools.dscode.store.spike.EmbeddedMultiProcessTest
          grep -h 'STORE_' build/test-results/test/TEST-tools.dscode.store.spike.*.xml | head -40 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Embedded store open
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.EmbeddedStoreOpenTest \
            --tests tools.dscode.store.NoRuntimeDownloadTest \
            --tests tools.dscode.store.StoreFileReleaseTest
          echo "STORE_OPEN_MS=$(tr -d '\r' < build/store-open-ms.txt)"
          echo "STORE_OPEN_SPACES_MS=$(tr -d '\r' < build/store-open-spaces-ms.txt)"
          echo "${RUNNER_OS} store open: $(tr -d '\r' < build/store-open-ms.txt) ms; path with spaces: $(tr -d '\r' < build/store-open-spaces-ms.txt) ms" >> "$GITHUB_STEP_SUMMARY"

      - name: Embedded store seam
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.sql.StoreDialectInventoryTest \
            --tests tools.dscode.store.sql.StoreDialectTrapsTest \
            --tests tools.dscode.store.sql.StoreSchemaTest \
            --tests tools.dscode.store.StoreSchemaUpgradeTest \
            --tests tools.dscode.store.StoreFoundationTest \
            --tests tools.dscode.store.sql.StoreConcurrencyTest \
            --tests tools.dscode.store.StoreDriverMissingTest \
            --tests tools.dscode.store.sql.ChangeLogTriggerTest \
            --tests tools.dscode.store.sql.RunStateRouterTest

      - name: Embedded store sandboxes
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.StoreSandboxCliTest \
            --tests tools.dscode.store.StoreSandboxBindingTest \
            --tests tools.dscode.store.StoreSandboxRunStateTest \
            --tests tools.dscode.store.StoreSandboxIsolationTest \
            --tests tools.dscode.store.StoreSandboxWorkerTest \
            --tests tools.dscode.store.StoreSandboxPruneTest \
            --tests tools.dscode.store.StoreSandboxHardenTest \
            --tests tools.dscode.store.StoreGlueCompileTest \
            --tests tools.dscode.store.StoreGlueGapTest \
            --tests tools.dscode.store.StoreRunClasspathRefreshTest \
            --tests tools.dscode.store.SandboxIndependenceTest \
            --tests tools.dscode.store.SandboxCreateTimingTest \
            --tests tools.dscode.store.StoreFileReleaseTest
          grep -h 'SANDBOX_CREATE_MS' build/test-results/test/TEST-tools.dscode.store.SandboxCreateTimingTest.xml | head -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Agent surface popup live (real Chromium, must not skip)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.common.agentsurface.live.AgentSurfacePopupLiveTest
          report=build/test-results/test/TEST-tools.dscode.common.agentsurface.live.AgentSurfacePopupLiveTest.xml
          if grep -q '<skipped' "$report"; then
            echo "AgentSurfacePopupLiveTest skipped on ${RUNNER_OS}:"
            grep -A2 '<skipped' "$report" || true
            exit 1
          fi
          grep -o 'popup warnings: [^<]*' "$report" | head -1 | sed "s/^/${RUNNER_OS} /" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify agent contract
        shell: bash
        env:
          STRICT: ${{ vars.AGENT_CONTRACT_STRICT }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: |
          args=(--base-ref "origin/${BASE_REF}")
          if [[ "${STRICT}" == "true" ]]; then
            args+=(--strict)
          fi
          python scripts/verify_agent_contract.py "${args[@]}"

      - name: Verify generated repository index
        shell: bash
        run: python scripts/refresh_agent_index.py --check

      - name: Publish and run the consumer-simulation harness
        shell: pwsh
        run: |
          .\gradlew.bat publishToMavenLocal -x test --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # consumer_sim.py runs the documented mvnw.cmd exec:java line in Windows PowerShell and asserts exit 2.
          .\scripts\consumer_sim.ps1
          exit $LASTEXITCODE

      - name: Windows UIA live snapshot
        if: always()
        shell: pwsh
        run: .\gradlew.bat --no-daemon :dom-engine:test --tests dev.domengine.snapshot.SnapshotCoverageTest.liveDesktopWhenThePlatformExists

  macos:
    name: macOS targeted Store and core
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Embedded store spike
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.spike.EmbeddedStoreSpikeTest \
            --tests tools.dscode.store.spike.EmbeddedMultiProcessTest
          grep -h 'STORE_' build/test-results/test/TEST-tools.dscode.store.spike.*.xml | head -40 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Embedded store open
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.EmbeddedStoreOpenTest \
            --tests tools.dscode.store.NoRuntimeDownloadTest \
            --tests tools.dscode.store.StoreFileReleaseTest
          echo "STORE_OPEN_MS=$(tr -d '\r' < build/store-open-ms.txt)"
          echo "STORE_OPEN_SPACES_MS=$(tr -d '\r' < build/store-open-spaces-ms.txt)"
          echo "${RUNNER_OS} store open: $(tr -d '\r' < build/store-open-ms.txt) ms; path with spaces: $(tr -d '\r' < build/store-open-spaces-ms.txt) ms" >> "$GITHUB_STEP_SUMMARY"

      - name: Embedded store seam
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.sql.StoreDialectInventoryTest \
            --tests tools.dscode.store.sql.StoreDialectTrapsTest \
            --tests tools.dscode.store.sql.StoreSchemaTest \
            --tests tools.dscode.store.StoreSchemaUpgradeTest \
            --tests tools.dscode.store.StoreFoundationTest \
            --tests tools.dscode.store.sql.StoreConcurrencyTest \
            --tests tools.dscode.store.StoreDriverMissingTest \
            --tests tools.dscode.store.sql.ChangeLogTriggerTest \
            --tests tools.dscode.store.sql.RunStateRouterTest

      - name: Embedded store sandboxes
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.StoreSandboxCliTest \
            --tests tools.dscode.store.StoreSandboxBindingTest \
            --tests tools.dscode.store.StoreSandboxRunStateTest \
            --tests tools.dscode.store.StoreSandboxIsolationTest \
            --tests tools.dscode.store.StoreSandboxWorkerTest \
            --tests tools.dscode.store.StoreSandboxPruneTest \
            --tests tools.dscode.store.StoreSandboxHardenTest \
            --tests tools.dscode.store.StoreGlueCompileTest \
            --tests tools.dscode.store.StoreGlueGapTest \
            --tests tools.dscode.store.StoreRunClasspathRefreshTest \
            --tests tools.dscode.store.SandboxIndependenceTest \
            --tests tools.dscode.store.SandboxCreateTimingTest \
            --tests tools.dscode.store.StoreFileReleaseTest
          grep -h 'SANDBOX_CREATE_MS' build/test-results/test/TEST-tools.dscode.store.SandboxCreateTimingTest.xml | head -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Targeted core agent surface and Cucumber boundary
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests 'tools.dscode.architecture.*' \
            --tests tools.dscode.common.agentsurface.PopupRemovalKindTest \
            --tests tools.dscode.common.agentsurface.AgentSurfaceRouterTest \
            --tests tools.dscode.common.agentsurface.NativeHighlightRouteTest \
            --tests tools.dscode.browser.SurfaceAssetsTest

      - name: Agent surface popup live (real Chromium, must not skip)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.common.agentsurface.live.AgentSurfacePopupLiveTest \
            --tests tools.dscode.common.agentsurface.PopupHostCloseTest \
            --tests tools.dscode.common.agentsurface.PopupSandboxFallbackTest
          report=build/test-results/test/TEST-tools.dscode.common.agentsurface.live.AgentSurfacePopupLiveTest.xml
          if grep -q '<skipped' "$report"; then
            echo "AgentSurfacePopupLiveTest skipped on ${RUNNER_OS}:"
            grep -A2 '<skipped' "$report" || true
            exit 1
          fi
          grep -o 'popup warnings: [^<]*' "$report" | head -1 | sed "s/^/${RUNNER_OS} /" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: macOS Accessibility probe (timing only)
        if: always()
        run: |
          start=$(date +%s)
          osascript -e 'tell application "System Events" to count (processes whose background only is false)' 2>&1 || true
          echo "processes probe: $(( $(date +%s) - start )) s"
          start=$(date +%s)
          osascript -e 'tell application "System Events" to count UI elements of (first process whose frontmost is true)' 2>&1 || true
          echo "front app UI elements probe: $(( $(date +%s) - start )) s"
          start=$(date +%s)
          osascript -e 'tell application "System Events" to tell (first process whose frontmost is true) to get {name, role of every UI element, size of every UI element}' 2>&1 || true
          echo "front app roles probe: $(( $(date +%s) - start )) s"

      - name: macOS desktop live snapshot (must not skip)
        if: always()
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :dom-engine:test \
            --tests dev.domengine.desktop.MacAccessibilityScriptTest \
            --tests dev.domengine.snapshot.SnapshotCoverageTest.liveDesktopWhenThePlatformExists
          for report in dom-engine/build/test-results/test/TEST-dev.domengine.desktop.MacAccessibilityScriptTest.xml \
                        dom-engine/build/test-results/test/TEST-dev.domengine.snapshot.SnapshotCoverageTest.xml; do
            if grep -q '<skipped' "$report"; then
              echo "macOS desktop live snapshot must run, but a test skipped in ${report}:" | tee -a "$GITHUB_STEP_SUMMARY"
              grep -A2 '<skipped' "$report" | tee -a "$GITHUB_STEP_SUMMARY" || true
              exit 1
            fi
          done
          echo "macOS desktop live snapshot ran (macos-ax); generated AppleScript compiles with osacompile" | tee -a "$GITHUB_STEP_SUMMARY"

  dom-engine-live:
    name: Java DOM live Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Embedded store spike
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.spike.EmbeddedStoreSpikeTest \
            --tests tools.dscode.store.spike.EmbeddedMultiProcessTest
          grep -h 'STORE_' build/test-results/test/TEST-tools.dscode.store.spike.*.xml | head -40 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Embedded store open
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.EmbeddedStoreOpenTest \
            --tests tools.dscode.store.NoRuntimeDownloadTest \
            --tests tools.dscode.store.StoreFileReleaseTest
          echo "STORE_OPEN_MS=$(tr -d '\r' < build/store-open-ms.txt)"
          echo "STORE_OPEN_SPACES_MS=$(tr -d '\r' < build/store-open-spaces-ms.txt)"
          echo "${RUNNER_OS} store open: $(tr -d '\r' < build/store-open-ms.txt) ms; path with spaces: $(tr -d '\r' < build/store-open-spaces-ms.txt) ms" >> "$GITHUB_STEP_SUMMARY"

      - name: Embedded store seam
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.sql.StoreDialectInventoryTest \
            --tests tools.dscode.store.sql.StoreDialectTrapsTest \
            --tests tools.dscode.store.sql.StoreSchemaTest \
            --tests tools.dscode.store.StoreSchemaUpgradeTest \
            --tests tools.dscode.store.StoreFoundationTest \
            --tests tools.dscode.store.sql.StoreConcurrencyTest \
            --tests tools.dscode.store.StoreDriverMissingTest \
            --tests tools.dscode.store.sql.ChangeLogTriggerTest \
            --tests tools.dscode.store.sql.RunStateRouterTest

      - name: Embedded store sandboxes
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.store.StoreSandboxCliTest \
            --tests tools.dscode.store.StoreSandboxBindingTest \
            --tests tools.dscode.store.StoreSandboxRunStateTest \
            --tests tools.dscode.store.StoreSandboxIsolationTest \
            --tests tools.dscode.store.StoreSandboxWorkerTest \
            --tests tools.dscode.store.StoreSandboxPruneTest \
            --tests tools.dscode.store.StoreSandboxHardenTest \
            --tests tools.dscode.store.StoreGlueCompileTest \
            --tests tools.dscode.store.StoreGlueGapTest \
            --tests tools.dscode.store.StoreRunClasspathRefreshTest \
            --tests tools.dscode.store.SandboxIndependenceTest \
            --tests tools.dscode.store.SandboxCreateTimingTest \
            --tests tools.dscode.store.StoreFileReleaseTest
          grep -h 'SANDBOX_CREATE_MS' build/test-results/test/TEST-tools.dscode.store.SandboxCreateTimingTest.xml | head -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Install Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          meta="$(python3 - <<'PY'
          import json, urllib.request
          data = json.load(urllib.request.urlopen("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"))
          stable = data["channels"]["Stable"]
          def url(kind):
              return next(item["url"] for item in stable["downloads"][kind] if item["platform"] == "linux64")
          print(stable["version"])
          print(url("chrome"))
          print(url("chromedriver"))
          PY
          )"
          version="$(printf '%s\n' "$meta" | sed -n '1p')"
          url="$(printf '%s\n' "$meta" | sed -n '2p')"
          driver="$(printf '%s\n' "$meta" | sed -n '3p')"
          curl -fsSL -o /tmp/chrome-linux64.zip "$url"
          unzip -q /tmp/chrome-linux64.zip -d "$RUNNER_TEMP/chrome"
          curl -fsSL -o /tmp/chromedriver-linux64.zip "$driver"
          unzip -q /tmp/chromedriver-linux64.zip -d "$RUNNER_TEMP/chrome"
          chrome="$RUNNER_TEMP/chrome/chrome-linux64/chrome"
          bindir="$RUNNER_TEMP/chrome/bin"
          mkdir -p "$bindir"
          ln -sfn "$chrome" "$bindir/google-chrome"
          ln -sfn "$chrome" "$bindir/google-chrome-stable"
          ln -sfn "$chrome" "$bindir/chrome"
          ln -sfn "$RUNNER_TEMP/chrome/chromedriver-linux64/chromedriver" "$bindir/chromedriver"
          echo "DOMENGINE_CHROME=$chrome" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "CHROME_TEST_BIN=$bindir" >> "$GITHUB_ENV"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/google-chrome" --version
          "$bindir/chromedriver" --version
          echo "chrome-for-testing $version"

      - name: DOM engine tests including live Chrome
        run: |
          set +e
          ./gradlew --no-daemon :dom-engine:test
          code=$?
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path("dom-engine/build/test-results/test").glob("TEST-dev.domengine.snapshot.LiveEdgeSnapshotTest.xml"))
          if not reports:
              print("LiveEdgeSnapshotTest: no result")
          else:
              cases = ET.parse(reports[0]).getroot().findall("testcase")
              ran = skipped = failed = 0
              notes = []
              for case in cases:
                  name = case.attrib.get("name", "")
                  skip = case.find("skipped")
                  if skip is not None:
                      skipped += 1
                      message = (skip.attrib.get("message") or "").strip()
                      notes.append(name + (": " + message if message else ""))
                  elif case.find("failure") is not None or case.find("error") is not None:
                      failed += 1
                      notes.append(name + ": failed")
                  else:
                      ran += 1
              detail = ("; " + "; ".join(notes)) if notes else ""
              print(f"LiveEdgeSnapshotTest: ran {ran}, skipped {skipped}, failed {failed}{detail}")
          PY
          exit "$code"

      - name: Workbench direct-control attach on the Java engine
        run: ./gradlew --no-daemon :pickleball-control-protocol:test --tests tools.dscode.control.protocol.DirectControlProviderTest

      - name: Unjoined-driver repro tests
        run: ./gradlew --no-daemon :test --tests tools.dscode.common.composite.ContextAnchorReproTest --tests tools.dscode.common.domoperations.NestAnchorReproTest

      - name: Java engine adapter live tests
        run: ./gradlew --no-daemon :test --tests tools.dscode.common.composite.live.*

      - name: Agent surface popup live (real Chromium, must not skip)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :test \
            --tests tools.dscode.common.agentsurface.live.AgentSurfacePopupLiveTest \
            --tests tools.dscode.common.agentsurface.PopupHostCloseTest \
            --tests tools.dscode.common.agentsurface.PopupSandboxFallbackTest
          report=build/test-results/test/TEST-tools.dscode.common.agentsurface.live.AgentSurfacePopupLiveTest.xml
          if grep -q '<skipped' "$report"; then
            echo "AgentSurfacePopupLiveTest skipped on ${RUNNER_OS}:"
            grep -A2 '<skipped' "$report" || true
            exit 1
          fi
          grep -o 'popup warnings: [^<]*' "$report" | head -1 | sed "s/^/${RUNNER_OS} /" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Consumer @dom-composite on native and cucumber
        env:
          PKB_COMPOSITE: "on"
        run: |
          set -euo pipefail
          if [ -n "${CHROME_TEST_BIN:-}" ]; then
            PATH="$(printf '%s\n' "$PATH" | tr ':' '\n' | grep -vxF "$CHROME_TEST_BIN" | paste -sd: -)"
            export PATH
          fi
          ./gradlew --no-daemon publishToMavenLocal -x test
          cd maven-consumer-project
          mvn -B test -Dpkb_tags=@dom-composite -Dpkb_engine=native -Dpkb_composite=on -Dpkb_runvars.pkb_browser=CHROME_HEADLESS
          mvn -B test -Dpkb_tags=@dom-composite -Dpkb_engine=cucumber -Dpkb_composite=on -Dpkb_runvars.pkb_browser=CHROME_HEADLESS

      - name: Linux desktop live snapshot
        if: always()
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y at-spi2-core xvfb imagemagick dbus-x11
          xvfb-run -a bash -lc '
            set -euo pipefail
            if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then
              eval "$(dbus-launch --sh-syntax)"
              export DBUS_SESSION_BUS_ADDRESS
            fi
            launcher=""
            for candidate in /usr/libexec/at-spi-bus-launcher /usr/lib/at-spi2-core/at-spi-bus-launcher; do
              if [ -x "$candidate" ]; then launcher="$candidate"; break; fi
            done
            if [ -n "$launcher" ]; then
              "$launcher" --launch-immediately >/tmp/at-spi-bus.log 2>&1 &
              sleep 1
            fi
            ./gradlew --no-daemon :dom-engine:test --tests dev.domengine.desktop.LiveDesktopSnapshotTest --tests dev.domengine.snapshot.SnapshotCoverageTest.liveDesktopWhenThePlatformExists
          '

      - name: Edge live snapshot
        if: always()
        run: ./gradlew --no-daemon :dom-engine:test --tests dev.domengine.snapshot.LiveEdgeSnapshotTest

      - name: Firefox live snapshot
        if: always()
        run: ./gradlew --no-daemon :test --tests tools.dscode.common.seleniumextensions.LiveFirefoxSnapshotTest

  gate:
    needs: [windows, macos, dom-engine-live]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Block the release unless Windows, macOS, and live Chrome passed
        shell: bash
        run: |
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.macos.result }}" = "success"
          test "${{ needs.dom-engine-live.result }}" = "success"
