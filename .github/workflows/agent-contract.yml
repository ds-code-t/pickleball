name: Agent Contract and Consumer Validation

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify agent contract
        shell: bash
        env:
          STRICT: ${{ vars.AGENT_CONTRACT_STRICT }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: |
          args=(--base-ref "origin/${BASE_REF}")
          if [[ "${STRICT}" == "true" ]]; then
            args+=(--strict)
          fi
          python scripts/verify_agent_contract.py "${args[@]}"

      - name: Verify generated repository index
        run: python scripts/refresh_agent_index.py --check

      - name: Test and publish framework locally
        run: |
          chmod +x gradlew
          ./gradlew test publishToMavenLocal

      - name: Test Maven consumer project
        run: |
          chmod +x maven-consumer-project/mvnw
          bash ./maven-consumer-project/mvnw -f maven-consumer-project/pom.xml -U test -Dpkb_browser=CHROME_HEADLESS
