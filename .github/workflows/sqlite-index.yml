name: SQLite index parity

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: SQLite parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rebuild and search parity
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :pickleball-control-protocol:test --tests tools.dscode.control.protocol.DiagnosticSqliteIndexTest
          ./gradlew --no-daemon :test --tests tools.dscode.common.reporting.diagnostic.DiagnosticIndexRebuilderSqliteTest
