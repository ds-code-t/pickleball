<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Text Match</title>
</head>
<body>
    <button id="save" type="button" onclick="document.getElementById('clicked').textContent=this.id">Save</button>
    <button id="save-all" type="button" onclick="document.getElementById('clicked').textContent=this.id">Save All</button>
    <button id="autosave" type="button" onclick="document.getElementById('clicked').textContent=this.id">Autosave</button>
    <p id="clicked"></p>
    <label for="secret">Secret Field</label>
    <input id="secret" type="text" autocomplete="off">
</body>
</html>
