# Local override example for the Maven consumer.
# This repository commits the file intentionally so consumer projects can see the pattern.
# Values here override the same keys in pickleball.properties.
example.precedence.local=pickleball_local.properties
example.precedence.runner-property=pickleball_local.properties

# Cucumber tag expression. Examples: @all, @smoke, "@smoke and not @slow"
#pkb_tags=@all

# Optional feature path for <data:...> scenario-marker lookups.
#pkb_datapath=src/test/resources/data

# Optional reusable component and service-call feature paths.
#pkb_componentpath=src/test/resources/component
#pkb_callpath=src/test/resources/calls

# Test environment name. Values are project-defined. Examples: local, DEV, QA, UAT, PROD
#pkb_environment=QA

# Browser configuration name. Values are project-defined. Examples: chrome, chrome_headless, firefox, edge
#pkb_browser=chrome
# Enable additional browser troubleshooting.
# Allows browser to remain open on scenario end or failure and restarting step with the retained DOM state.
#pkb_debugbrowser=true

# Logging level. Values: trace, debug, info, warn, error
#pkb_loglevel=info

# Maximum number of scenarios to run in parallel. Value: positive integer
#pkb_parallel=10

# REPORT GENERATION
# a composite report is generated by default in the reports folder if nothing is set explicitly.
# Combined report with individual tabs for each scenario.
# pkb_compositeReport=true
# can be used to set a custom output path and filename. Supports using an insert <TIME>
#pkb_compositeReport=reports/composite-report-<TIME>.html


# Individual scenario report
# pkb_scenarioReport=true
# can be used to set a custom output path and filename. Supports inserts such as <SCENARIO_NAME> and <TIME>.
#pkb_scenarioReport=reports/<SCENARIO_NAME>-<TIME>.html
