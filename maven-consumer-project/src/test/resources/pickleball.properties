# Optional Pickleball profile and controlled-run configuration examples.
# This file intentionally contains only comments so it does not change the consumer defaults.

# Select one profile:
# pkb_profile=qa

# Compose profiles left-to-right; later values win. Missing execution-context values
# (glue/features/data/call/component/config paths) inherit from project configuration.
# pkb_profile=qa,browser_chrome

# Define an inline named profile from any normal Pickleball configuration source.
# Quote values that contain commas or semicolons.
# pkb_profile_smoke=pkb_tags=@smoke, pkb_browser=CHROME_HEADLESS

# Preferred controlled-run input. Optional normal RunVars do not leak into this run;
# missing execution-context RunVars inherit from the project configuration.
# pkb_runvars=pkb_tags=@smoke, pkb_browser=CHROME_HEADLESS

# Expanded form avoids compact parsing and preserves blank tombstones literally:
# pkb_runvars.pkb_tags=@smoke
# pkb_runvars.pkb_features=

# pkb_run_profile is generated by Pickleball after resolution and is the canonical,
# deterministic serialized RunVar output. It is reserved internal output: external
# pkb_run_profile / pkb_run_profile.* input is rejected. Use pkb_runvars for input.

# Config mapping source. When absent or explicitly blank, the Java fallback remains
# the legacy classpath resource root "configs". The mapping namespace is always <configs...>.
# pkb_configpath=classpath:configs

# ReportPortal properties can use pkb_rp_* aliases in properties/profiles/runner configuration:
# pkb_rp_enable=true
# pkb_rp_project=my-project
# Supply API keys through a secure source such as -Drp.api.key=...; named profiles can
# reference that default-profile value as <default_profile.pkb_rp_api_key>.
