// Pickleball Studio is built as an isolated executable Spring Boot application
// and bundled into the normal Pickleball artifact without adding Studio
// dependencies to the consumer runtime classpath or published Maven graph.
//
// Shadow 9 keeps the executable Studio JAR opaque when it is copied into the
// outer Pickleball JAR. Studio's own Spring/Spring AI dependencies remain under
// BOOT-INF/lib inside the nested JAR and are loaded only by the Studio child JVM.
def studioProject = project(':pickleball-studio')
def studioJarFile = studioProject.layout.buildDirectory.file('libs/pickleball-studio.jar')
def studioDestination = 'META-INF/pickleball/studio'

pluginManager.withPlugin('com.gradleup.shadow') {
    tasks.named('shadowJar').configure {
        dependsOn ':pickleball-studio:bootJar'

        from(studioJarFile) {
            into studioDestination
        }

        manifest {
            attributes(
                    'Main-Class': 'tools.dscode.studio.launcher.PickleballMain',
                    'Implementation-Title': 'Pickleball',
                    'Implementation-Version': project.version.toString()
            )
        }
    }
}
