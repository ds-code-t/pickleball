import java.nio.charset.StandardCharsets
import java.net.URI

// Embeds the exact Pickleball source revision used to build the Maven artifact.
def buildInfoDir = layout.buildDirectory.dir('generated/pickleball-build-provenance')

// Gradle 9 removed Project.exec inside task actions; a plain process keeps the stamp populated.
// Status, log, and rev-parse stay here. The diff hash is a forked JDK-only process
// (WorkingTreeDiffHash) so a multi-megabyte `git diff --binary` is never a String
// in this daemon.
def gitWorkDir = rootProject.projectDir
def gitText = { Object... args ->
    try {
        Process process = new ProcessBuilder(['git'] + args.collect { String.valueOf(it) })
                .directory(gitWorkDir)
                .redirectError(ProcessBuilder.Redirect.DISCARD)
                .start()
        String out = new String(process.inputStream.readAllBytes(), StandardCharsets.UTF_8)
        process.waitFor() == 0 ? out.trim() : ''
    } catch (Throwable ignored) {
        ''
    }
}

def sanitizeRemote = { String remote ->
    if (!remote) return ''
    try {
        URI uri = URI.create(remote.trim())
        if (uri.scheme && uri.host && uri.userInfo) {
            String clean = "${uri.scheme}://${uri.host}"
            if (uri.port >= 0) clean += ":${uri.port}"
            clean += uri.rawPath ?: ''
            if (uri.rawQuery) clean += "?${uri.rawQuery}"
            if (uri.rawFragment) clean += "#${uri.rawFragment}"
            return clean
        }
    } catch (Throwable ignored) {
    }
    remote.trim()
}

def workingTreeStamp = {
    File outDir = layout.buildDirectory.dir('provenance-hasher').get().asFile
    outDir.mkdirs()
    String javaHome = System.getProperty('java.home')
    File source = rootProject.file('src/main/java/tools/dscode/release/WorkingTreeDiffHash.java')
    Process compile = new ProcessBuilder([
            javaHome + '/bin/javac', '-d', outDir.absolutePath, source.absolutePath
    ]).redirectError(ProcessBuilder.Redirect.INHERIT).start()
    if (compile.waitFor() != 0) {
        throw new GradleException('Could not compile WorkingTreeDiffHash')
    }
    Process run = new ProcessBuilder([
            javaHome + '/bin/java', '-Xmx128m', '-cp', outDir.absolutePath,
            'tools.dscode.release.WorkingTreeDiffHash', rootProject.projectDir.absolutePath
    ]).redirectError(ProcessBuilder.Redirect.INHERIT).start()
    String output = new String(run.inputStream.readAllBytes(), StandardCharsets.UTF_8)
    if (run.waitFor() != 0) {
        throw new GradleException('WorkingTreeDiffHash failed')
    }
    String[] lines = output.split('\n', -1)
    boolean dirty = lines.length > 0 && Boolean.parseBoolean(lines[0].trim())
    String hash = lines.length > 1 ? lines[1].trim() : ''
    return [dirty, dirty ? hash : '']
}

def generateBuildProvenance = tasks.register('generatePickleballBuildProvenance') {
    outputs.dir(buildInfoDir)
    outputs.upToDateWhen { false }
    doLast {
        def stamp = workingTreeStamp()
        Properties properties = new Properties()
        properties.setProperty('repositoryName', rootProject.name)
        properties.setProperty('version', project.version.toString())
        properties.setProperty('remote', sanitizeRemote(gitText('config', '--get', 'remote.origin.url')))
        properties.setProperty('branch', gitText('symbolic-ref', '--short', '-q', 'HEAD') ?: gitText('rev-parse', '--abbrev-ref', 'HEAD'))
        properties.setProperty('commit', gitText('rev-parse', 'HEAD'))
        properties.setProperty('commitMessage', gitText('log', '-1', '--pretty=%B'))
        properties.setProperty('dirty', Boolean.toString(stamp[0]))
        properties.setProperty('workingTreeDiffHash', stamp[1])

        File target = buildInfoDir.get().file('META-INF/pickleball-build.properties').asFile
        target.parentFile.mkdirs()
        target.withOutputStream { properties.store(it, 'Generated Pickleball build provenance') }
    }
}

pluginManager.withPlugin('java') {
    tasks.named('processResources').configure {
        dependsOn(generateBuildProvenance)
        from(buildInfoDir)
    }
}
