<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pickleball</title>
<style>
:root { --accent: #1f6feb; }
body { margin: 0; font-family: "Segoe UI", sans-serif; color: #1a1a1a; }
header { padding: 12px 16px; border-bottom: 4px solid var(--accent); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
nav { display: flex; gap: 12px; padding: 8px 16px; background: #f4f6f8; }
nav a { color: var(--accent); font-weight: 600; }
main { padding: 16px; }
label { display: block; margin: 8px 0; }
textarea { width: 100%; min-height: 80px; }
pre { white-space: pre-wrap; }
button { margin-right: 8px; }
</style>
</head>
<body>
<header>
<h1 id="title">Pickleball</h1>
<label>Branch <select id="branch"></select></label>
<label>Search <input id="search" type="text"></label>
<button id="lease" type="button">Lease</button>
<label>Answer <input id="ask-id" type="text"><input id="ask-value" type="text">
<button id="ask-answer" type="button">Answer</button></label>
</header>
<nav>
<a href="/scenarios">Scenarios</a>
<a href="/globals">Globals</a>
<a href="/data">Data</a>
<a href="/sql">Raw SQL</a>
</nav>
<main>
<section id="scenarios">
<h2>Scenarios</h2>
<label>Definition <input id="definition-path" type="text"></label>
<button id="open-definition" type="button">open definition</button>
<button id="save-definition" type="button">Save definition</button>
<div id="monaco" style="height: 240px; border: 1px solid #ccc"></div>
<pre id="definition-message"></pre>
<label>Session <input id="point-session" type="text"></label>
<label>Handle <input id="point-handle" type="text"></label>
<label>X <input id="point-x" type="text"></label>
<label>Y <input id="point-y" type="text"></label>
<button id="point" type="button">Point</button>
<div id="scenario-list"></div>
<div id="step-list"></div>
<pre id="definition-list"></pre>
<pre id="scenario-body"></pre>
</section>
<section id="globals">
<h2>Globals</h2>
<label>Name <input id="var-name" type="text"></label>
<label>Value <input id="var-value" type="text"></label>
<button id="var-set" type="button">Set</button>
<pre id="globals-body"></pre>
</section>
<section id="data">
<h2>Data</h2>
<pre id="data-body"></pre>
</section>
<section id="sql">
<h2>Raw SQL</h2>
<label>Query <textarea id="query">SELECT 1</textarea></label>
<button id="run-sql" type="button">Run</button>
<pre id="sql-body"></pre>
</section>
</main>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
const accents = ["#1f6feb", "#0f7b4c", "#8a4b08", "#6e3cbc", "#9b2335", "#0b6e7a", "#3d4c6b", "#5c4a32"];
document.querySelectorAll("a").forEach(function (link) {
    const href = link.getAttribute("href");
    if (href && location.search && href.indexOf("?") < 0) link.setAttribute("href", href + location.search);
});
async function callStore(args, verb) {
    const response = await fetch("/store" + location.search, {
        method: "POST",
        headers: { "content-type": "application/json", "x-pkb-ui-token": token },
        body: JSON.stringify({ verb: verb || "store", args: args })
    });
    return response.json();
}
function show(id) {
    ["scenarios", "globals", "data", "sql"].forEach(function (name) {
        document.getElementById(name).hidden = name !== id;
    });
}
function pageId() {
    const path = location.pathname;
    if (path === "/globals") return "globals";
    if (path === "/data") return "data";
    if (path === "/sql") return "sql";
    return "scenarios";
}
function payload(out) {
    let parsed;
    try { parsed = JSON.parse(out); } catch (failure) { return null; }
    if (parsed && Array.isArray(parsed.items) && parsed.items.length) return parsed.items[0];
    return parsed;
}
function glueText(out) {
    const body = payload(out);
    if (body && typeof body.text === "string") return body.text;
    return "";
}
function showCli(target, result) {
    const body = payload(result.out || "");
    const parts = [];
    if (result.err) parts.push(result.err);
    if (body && body.error) parts.push(body.error);
    if (body && body.fix) parts.push(body.fix);
    if (!parts.length) parts.push(result.out || "");
    target.textContent = parts.join("\n");
}
function cellsOf(row) {
    if (Array.isArray(row)) return row.map(function (cell) { return cell == null ? "" : String(cell); });
    if (row && typeof row === "object") {
        return Object.keys(row).map(function (key) { return row[key] == null ? "" : String(row[key]); });
    }
    return [row == null ? "" : String(row)];
}
function keepRow(row, text) {
    if (!text) return true;
    const cells = cellsOf(row);
    if (text.indexOf("exact:") === 0) {
        const want = text.substring("exact:".length);
        return cells.some(function (cell) { return cell === want; });
    }
    const joined = cells.join("\t");
    if (text.indexOf("re:") === 0) {
        try { return new RegExp(text.substring("re:".length)).test(joined); }
        catch (failure) { return false; }
    }
    return joined.indexOf(text) >= 0;
}
function filterDocument(out, text, key) {
    const body = payload(out);
    if (!body || !Array.isArray(body[key])) return out || "";
    return JSON.stringify(body[key].filter(function (row) { return keepRow(row, text); }));
}
function editorLanguage(path) {
    if (path.endsWith(".ts")) return "typescript";
    if (path.endsWith(".js")) return "javascript";
    return "java";
}
function paint(name) {
    document.getElementById("title").textContent = name;
    document.title = name;
    let hash = 0;
    for (let index = 0; index < name.length; index++) hash = (hash + name.charCodeAt(index)) % accents.length;
    document.documentElement.style.setProperty("--accent", accents[hash]);
}
function definitionMatches(source, stepText) {
    if (!stepText) return false;
    return source.indexOf('"' + stepText + '"') >= 0
        || source.indexOf("'" + stepText + "'") >= 0
        || source.indexOf("`" + stepText + "`") >= 0;
}
show(pageId());
document.getElementById("search").addEventListener("change", async function () {
    const text = document.getElementById("search").value;
    const page = pageId();
    if (page === "data") {
        await loadFiles(text);
        return;
    }
    if (page === "globals") {
        await loadVars(text);
        return;
    }
    if (page === "sql") {
        await runSql();
        return;
    }
    const args = ["query", "--json"];
    if (text) args.push("--text=" + text);
    const result = await callStore(args);
    document.getElementById("scenario-body").textContent = (result.out || "") + (result.err || "");
});
let definitionEditor = null;
function monacoRoot() {
    return "/node_modules/monaco-editor/min/vs";
}
function loadMonaco() {
    if (window.monaco && window.monaco.editor) return Promise.resolve();
    return new Promise(function (resolve, reject) {
        const script = document.createElement("script");
        script.src = monacoRoot() + "/loader.js" + location.search;
        script.onload = function () {
            window.require.config({ paths: { vs: monacoRoot().slice(1) }, urlArgs: "t=" + token });
            window.require(["vs/editor/editor.main"], resolve);
        };
        script.onerror = function () { reject(new Error("monaco")); };
        document.body.appendChild(script);
    });
}
async function setEditor(path, value) {
    await loadMonaco();
    const name = editorLanguage(path);
    if (!definitionEditor) {
        definitionEditor = window.monaco.editor.create(document.getElementById("monaco"), {
            value: value,
            language: name,
            automaticLayout: true
        });
        return;
    }
    definitionEditor.setValue(value);
    const model = definitionEditor.getModel ? definitionEditor.getModel() : null;
    if (model && window.monaco.editor.setModelLanguage) window.monaco.editor.setModelLanguage(model, name);
}
document.getElementById("open-definition").addEventListener("click", async function () {
    const path = document.getElementById("definition-path").value;
    const result = await callStore(["glue", "show", "--path=" + path, "--json"]);
    const message = document.getElementById("definition-message");
    showCli(message, result);
    try {
        await setEditor(path, glueText(result.out || ""));
    } catch (failure) {
        message.textContent = (message.textContent || "") + "\nmonaco did not load";
    }
});
document.getElementById("save-definition").addEventListener("click", async function () {
    const path = document.getElementById("definition-path").value;
    const text = definitionEditor ? definitionEditor.getValue() : "";
    const result = await callStore(["glue", "put", "--path=" + path, "--text=" + text]);
    showCli(document.getElementById("definition-message"), result);
});
document.getElementById("point").addEventListener("click", async function () {
    const session = document.getElementById("point-session").value;
    const handle = document.getElementById("point-handle").value;
    const x = document.getElementById("point-x").value;
    const y = document.getElementById("point-y").value;
    const args = ["--session=" + session];
    if (handle) args.push("--handle=" + handle);
    else args.push("--x=" + x, "--y=" + y);
    const result = await callStore(args, "point");
    document.getElementById("scenario-body").textContent = (result.out || "") + (result.err || "");
});
document.getElementById("lease").addEventListener("click", async function () {
    const result = await callStore(["take", "--target=ui"], "lease");
    document.getElementById("scenario-body").textContent = (result.out || "") + (result.err || "");
});
document.getElementById("ask-answer").addEventListener("click", async function () {
    const id = document.getElementById("ask-id").value;
    const value = document.getElementById("ask-value").value;
    const result = await callStore(["--id=" + id, "--value=" + value], "ask-answer");
    document.getElementById("scenario-body").textContent = (result.out || "") + (result.err || "");
});
async function runSql() {
    const args = ["sql", "--query=" + document.getElementById("query").value, "--json"];
    const text = document.getElementById("search").value;
    if (text) args.push("--text=" + text);
    const result = await callStore(args);
    document.getElementById("sql-body").textContent = (result.out || "") + (result.err || "");
}
document.getElementById("run-sql").addEventListener("click", runSql);
async function loadFiles(text) {
    const args = ["files", "list", "--json"];
    if (text) args.push("--text=" + text);
    const result = await callStore(args);
    document.getElementById("data-body").textContent = filterDocument(result.out || "", text, "files");
}
async function loadVars(text) {
    const args = ["var", "list", "--json"];
    if (text) args.push("--text=" + text);
    const result = await callStore(args);
    document.getElementById("globals-body").textContent = filterDocument(result.out || "", text, "vars");
}
document.getElementById("var-set").addEventListener("click", async function () {
    const name = document.getElementById("var-name").value;
    const value = document.getElementById("var-value").value;
    const result = await callStore(["var", "set", name, value]);
    showCli(document.getElementById("definition-message"), result);
    await loadVars(document.getElementById("search").value);
});
function renderScenarios(out) {
    const body = payload(out);
    const scenarios = body && Array.isArray(body.scenarios) ? body.scenarios : [];
    const list = document.getElementById("scenario-list");
    list.textContent = "";
    scenarios.forEach(function (scenario) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = (scenario.keyword || "Scenario") + " " + (scenario.name || "");
        button.addEventListener("click", async function () { await expandScenario(scenario); });
        list.appendChild(button);
    });
}
async function expandScenario(scenario) {
    const feature = scenario.path || "";
    const which = scenario.ord != null ? String(scenario.ord) : (scenario.name || "");
    const result = await callStore(["steps", "list", "--json", "--feature=" + feature, "--scenario=" + which]);
    const body = payload(result.out || "");
    const steps = body && Array.isArray(body.steps) ? body.steps : [];
    const list = document.getElementById("step-list");
    list.textContent = "";
    steps.forEach(function (step) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = (step.keyword || "") + " " + (step.text || "");
        button.addEventListener("click", async function () { await expandStep(step); });
        list.appendChild(button);
    });
    document.getElementById("scenario-body").textContent = (result.out || "") + (result.err || "");
}
async function expandStep(step) {
    const listed = await callStore(["glue", "list", "--json"]);
    const body = payload(listed.out || "");
    const items = body && Array.isArray(body.items) ? body.items : [];
    const paths = items.map(function (item) { return item.path || ""; }).filter(function (path) {
        return path.endsWith(".java") || path.endsWith(".js") || path.endsWith(".ts");
    });
    document.getElementById("definition-list").textContent = paths.join("\n");
    let matched = "";
    let source = "";
    for (let index = 0; index < paths.length; index++) {
        const shown = await callStore(["glue", "show", "--path=" + paths[index], "--json"]);
        const text = glueText(shown.out || "");
        if (!matched && definitionMatches(text, step.text || "")) {
            matched = paths[index];
            source = text;
        }
    }
    if (!matched) return;
    document.getElementById("definition-path").value = matched;
    try {
        await setEditor(matched, source);
    } catch (failure) {
        document.getElementById("definition-message").textContent += "\nmonaco did not load";
    }
}
callStore(["sandbox", "list", "--json"]).then(function (result) {
    const body = result.out || "";
    const parsed = payload(body);
    const rows = parsed && Array.isArray(parsed.sandboxes) ? parsed.sandboxes : [];
    let names = rows.map(function (row) { return row.name; }).filter(Boolean);
    if (!names.length) {
        const pattern = /"name"\s*:\s*"([^"]+)"/g;
        let match;
        while ((match = pattern.exec(body))) names.push(match[1]);
    }
    const select = document.getElementById("branch");
    select.textContent = "";
    names.forEach(function (name) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
    });
    let current = names[0] || "main";
    rows.forEach(function (row) {
        if (row.inUse && row.name) current = row.name;
    });
    select.value = current;
    paint(current);
});
document.getElementById("branch").addEventListener("change", function () {
    const name = document.getElementById("branch").value;
    callStore(["sandbox", "use", name]);
    paint(name);
});
callStore(["scenarios", "list", "--json"]).then(function (result) {
    if (result.out) {
        renderScenarios(result.out);
        document.getElementById("scenario-body").textContent = result.out;
    }
});
loadVars("");
loadFiles("");
</script>
</body>
</html>
