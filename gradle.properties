# Bound the build JVM so a test worker can coexist in a small sandbox.
# Test workers set their own heap in build.gradle (maxParallelForks = 1, -Xmx1536m).
# CI runners have more RAM; 768m is enough to weave and publish.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.daemon.idletimeout=10000
