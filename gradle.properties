# Bound the build JVM so a test worker can coexist in a small sandbox.
# Test workers: -Ppkb.test.forks (default 1) is maxParallelForks.
# Root and dom-engine workers may grow to 1536m. Other modules cap at 768m.
# minHeapSize is 64m, so a light worker does not reserve the ceiling.
# CI runners have more RAM; 768m is enough to weave and publish.
# org.gradle.parallel stays false so projects do not run their tests at once.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.daemon.idletimeout=10000
