plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

tasks.jar {
    archiveFileName.set('pickleball-studio.jar')
    manifest {
        attributes(
                'Main-Class': 'tools.dscode.studio.StudioApplication',
                'Implementation-Title': 'Pickleball Studio',
                'Implementation-Version': project.version.toString()
        )
    }
}

def studioEntry = 'META-INF/pickleball/studio/pickleball-studio.jar'

tasks.register('verifyBundledStudio') {
    group = 'verification'
    description = 'Verifies that the normal Pickleball JAR contains the isolated Studio application.'
    dependsOn rootProject.tasks.named('shadowJar')

    doLast {
        def pickleballJar = rootProject.tasks.named('shadowJar').get().archiveFile.get().asFile

        new java.util.zip.ZipFile(pickleballJar).withCloseable { zip ->
            def studioZipEntry = zip.getEntry(studioEntry)
            if (studioZipEntry == null) {
                def nearbyEntries = java.util.Collections.list(zip.entries())
                        .findAll { it.name.startsWith('META-INF/pickleball/') }
                        .collect { it.name }
                        .take(25)
                throw new GradleException(
                        "Missing bundled Studio entry: ${studioEntry}\n" +
                                "Pickleball JAR: ${pickleballJar}\n" +
                                "Nearby packaged entries: ${nearbyEntries}"
                )
            }

            def leakedStudioEntries = java.util.Collections.list(zip.entries())
                    .collect { it.name }
                    .findAll {
                        it == 'tools/dscode/studio/StudioApplication.class' ||
                                it.startsWith('tools/dscode/studio/workspace/')
                    }
            if (!leakedStudioEntries.isEmpty()) {
                throw new GradleException(
                        'Studio implementation leaked into the outer Pickleball classpath: ' +
                                leakedStudioEntries.take(10)
                )
            }

            def outerManifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            if (outerManifestEntry == null) {
                throw new GradleException('Pickleball JAR has no manifest')
            }

            def outerManifest = new java.util.jar.Manifest(zip.getInputStream(outerManifestEntry))
            def outerMainClass = outerManifest.mainAttributes.getValue('Main-Class')
            if (outerMainClass != 'tools.dscode.studio.launcher.PickleballMain') {
                throw new GradleException("Unexpected Pickleball Main-Class: ${outerMainClass}")
            }

            def nestedBytes = zip.getInputStream(studioZipEntry).readAllBytes()
            def nestedFile = File.createTempFile('pickleball-studio-verify-', '.jar')
            try {
                nestedFile.bytes = nestedBytes
                new java.util.jar.JarFile(nestedFile).withCloseable { nestedJar ->
                    def studioMainClass = nestedJar.manifest?.mainAttributes?.getValue('Main-Class')
                    if (studioMainClass != 'tools.dscode.studio.StudioApplication') {
                        throw new GradleException("Unexpected Studio Main-Class: ${studioMainClass}")
                    }
                    if (nestedJar.getEntry('tools/dscode/studio/StudioApplication.class') == null) {
                        throw new GradleException('Nested Studio JAR is missing StudioApplication.class')
                    }
                }
            } finally {
                nestedFile.delete()
            }
        }
    }
}
