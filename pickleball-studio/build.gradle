plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
}

group = rootProject.group
version = rootProject.version

def studioGradleToolingApiVersion = '9.6.1'

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.gradle.org/gradle/libs-releases')
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

configurations {
    studioMavenRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'

    // Studio embeds the public Gradle Tooling API for project model/navigation.
    // The API follows each workspace's project-specific Gradle distribution by
    // default and does not add Gradle dependencies to Pickleball consumers.
    implementation "org.gradle:gradle-tooling-api:${studioGradleToolingApiVersion}"

    // Match Pickleball Core's current Gherkin parser/message protocol so Studio
    // navigation parses the same feature grammar without depending on Core.
    implementation 'io.cucumber:gherkin:35.1.0'
    implementation 'io.cucumber:messages:29.0.1'

    // Keep Maven's own dependency graph separate from the Spring application
    // classpath. These jars are bundled as opaque Studio tool resources and
    // extracted to a private cache before Maven is started in a child JVM.
    studioMavenRuntime 'commons-cli:commons-cli:1.11.0'
    studioMavenRuntime 'org.apache.maven:maven-compat:3.9.16'
    studioMavenRuntime 'org.apache.maven:maven-core:3.9.16'
    studioMavenRuntime 'org.apache.maven:maven-embedder:3.9.16'
    studioMavenRuntime 'org.apache.maven:maven-slf4j-provider:3.9.16'
    studioMavenRuntime 'org.apache.maven.resolver:maven-resolver-connector-basic:1.9.27'
    studioMavenRuntime 'org.apache.maven.resolver:maven-resolver-transport-file:1.9.27'
    studioMavenRuntime 'org.apache.maven.resolver:maven-resolver-transport-http:1.9.27'
    studioMavenRuntime 'org.apache.maven.resolver:maven-resolver-transport-wagon:1.9.27'
    studioMavenRuntime 'org.apache.maven.wagon:wagon-file:3.5.3'
    studioMavenRuntime 'org.apache.maven.wagon:wagon-http:3.5.3'
    studioMavenRuntime 'org.eclipse.sisu:org.eclipse.sisu.plexus:1.0.0'
    studioMavenRuntime 'org.fusesource.jansi:jansi:2.4.3'
    studioMavenRuntime 'org.slf4j:jcl-over-slf4j:1.7.36'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

def studioMavenVersion = '3.9.16'
def generatedMavenResources = layout.buildDirectory.dir('generated-resources/studio-maven-runtime')
def generatedMavenLib = generatedMavenResources.map {
    it.dir("META-INF/pickleball/studio/tools/maven/${studioMavenVersion}/lib")
}
def generatedMavenIndex = generatedMavenResources.map {
    it.file("META-INF/pickleball/studio/tools/maven/${studioMavenVersion}/classpath.txt")
}

def stageStudioMavenRuntime = tasks.register('stageStudioMavenRuntime', Sync) {
    into generatedMavenLib
    from(configurations.studioMavenRuntime) {
        include '*.jar'
    }
}

def writeStudioMavenRuntimeIndex = tasks.register('writeStudioMavenRuntimeIndex') {
    dependsOn stageStudioMavenRuntime
    inputs.files(configurations.studioMavenRuntime)
    outputs.file(generatedMavenIndex)

    doLast {
        File index = generatedMavenIndex.get().asFile
        index.parentFile.mkdirs()
        def names = configurations.studioMavenRuntime.files
                .findAll { it.name.endsWith('.jar') }
                .collect { it.name }
                .sort()
        index.setText(names.join('\n') + '\n', 'UTF-8')
    }
}

sourceSets.main.resources.srcDir(generatedMavenResources)
tasks.named('processResources') {
    dependsOn writeStudioMavenRuntimeIndex
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
    if (gradle.gradleHomeDir != null) {
        systemProperty 'pickleball.studio.test.gradle.home', gradle.gradleHomeDir.absolutePath
    }
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

tasks.jar {
    enabled = false
}

tasks.named('bootJar') {
    dependsOn writeStudioMavenRuntimeIndex

    archiveFileName.set('pickleball-studio.jar')
    mainClass.set('tools.dscode.studio.StudioApplication')

    // Generated Maven tool resources are available to tests through
    // processResources. Copy them explicitly into the executable Boot JAR as
    // application resources so the child Studio JVM can extract them later.
    from(generatedMavenResources) {
        into 'BOOT-INF/classes'
    }

    manifest {
        attributes(
                'Implementation-Title': 'Pickleball Studio',
                'Implementation-Version': project.version.toString()
        )
    }
}

def studioEntry = 'META-INF/pickleball/studio/pickleball-studio.jar'

tasks.register('verifyBundledStudio') {
    group = 'verification'
    description = 'Verifies that the normal Pickleball JAR contains the isolated executable Studio application.'
    dependsOn rootProject.tasks.named('shadowJar')

    doLast {
        def pickleballJar = rootProject.tasks.named('shadowJar').get().archiveFile.get().asFile

        new java.util.zip.ZipFile(pickleballJar).withCloseable { zip ->
            def studioZipEntry = zip.getEntry(studioEntry)
            if (studioZipEntry == null) {
                def nearbyEntries = java.util.Collections.list(zip.entries())
                        .findAll { it.name.startsWith('META-INF/pickleball/') }
                        .collect { it.name }
                        .take(25)
                throw new GradleException(
                        "Missing bundled Studio entry: ${studioEntry}\n" +
                                "Pickleball JAR: ${pickleballJar}\n" +
                                "Nearby packaged entries: ${nearbyEntries}"
                )
            }

            def leakedStudioEntries = java.util.Collections.list(zip.entries())
                    .findAll { entry ->
                        !entry.isDirectory() &&
                                entry.name.endsWith('.class') &&
                                entry.name.startsWith('tools/dscode/studio/') &&
                                !entry.name.startsWith('tools/dscode/studio/launcher/')
                    }
                    .collect { it.name }
            if (!leakedStudioEntries.isEmpty()) {
                throw new GradleException(
                        'Studio implementation leaked into the outer Pickleball classpath: ' +
                                leakedStudioEntries.take(10)
                )
            }

            def outerManifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            if (outerManifestEntry == null) {
                throw new GradleException('Pickleball JAR has no manifest')
            }

            def outerManifest = new java.util.jar.Manifest(zip.getInputStream(outerManifestEntry))
            def outerMainClass = outerManifest.mainAttributes.getValue('Main-Class')
            if (outerMainClass != 'tools.dscode.studio.launcher.PickleballMain') {
                throw new GradleException("Unexpected Pickleball Main-Class: ${outerMainClass}")
            }

            def nestedBytes = zip.getInputStream(studioZipEntry).readAllBytes()
            def nestedFile = File.createTempFile('pickleball-studio-verify-', '.jar')
            try {
                nestedFile.bytes = nestedBytes
                new java.util.jar.JarFile(nestedFile).withCloseable { nestedJar ->
                    def manifest = nestedJar.manifest
                    def studioMainClass = manifest?.mainAttributes?.getValue('Main-Class')
                    def studioStartClass = manifest?.mainAttributes?.getValue('Start-Class')
                    if (studioMainClass != 'org.springframework.boot.loader.launch.JarLauncher') {
                        throw new GradleException("Unexpected Studio Main-Class: ${studioMainClass}")
                    }
                    if (studioStartClass != 'tools.dscode.studio.StudioApplication') {
                        throw new GradleException("Unexpected Studio Start-Class: ${studioStartClass}")
                    }
                    if (nestedJar.getEntry('BOOT-INF/classes/tools/dscode/studio/StudioApplication.class') == null) {
                        throw new GradleException('Nested Studio JAR is missing StudioApplication.class')
                    }
                    if (nestedJar.getEntry('BOOT-INF/classes/tools/dscode/studio/gui/StudioFrame.class') == null) {
                        throw new GradleException('Nested Studio JAR is missing the desktop UI')
                    }
                    if (nestedJar.getEntry('BOOT-INF/classes/tools/dscode/studio/runtime/RuntimeBridgeService.class') == null) {
                        throw new GradleException('Nested Studio JAR is missing the runtime bridge client service')
                    }
                    def hasMcpStarter = java.util.Collections.list(nestedJar.entries()).any {
                        it.name.startsWith('BOOT-INF/lib/spring-ai-starter-mcp-server-webmvc-')
                    }
                    if (!hasMcpStarter) {
                        throw new GradleException('Nested Studio JAR is missing the Spring AI MCP server starter')
                    }
                    def hasGradleToolingApi = java.util.Collections.list(nestedJar.entries()).any {
                        it.name == "BOOT-INF/lib/gradle-tooling-api-${studioGradleToolingApiVersion}.jar"
                    }
                    if (!hasGradleToolingApi) {
                        throw new GradleException('Nested Studio JAR is missing the Gradle Tooling API')
                    }
                    def hasJacksonDatabind = java.util.Collections.list(nestedJar.entries()).any {
                        it.name.startsWith('BOOT-INF/lib/jackson-databind-') && it.name.endsWith('.jar')
                    }
                    if (!hasJacksonDatabind) {
                        throw new GradleException('Nested Studio JAR is missing Jackson databind for runtime bridge JSON')
                    }
                    if (nestedJar.getEntry('BOOT-INF/lib/gherkin-35.1.0.jar') == null) {
                        throw new GradleException('Nested Studio JAR is missing Gherkin 35.1.0')
                    }
                    if (nestedJar.getEntry('BOOT-INF/lib/messages-29.0.1.jar') == null) {
                        throw new GradleException('Nested Studio JAR is missing Cucumber Messages 29.0.1')
                    }
                    def mavenIndex = "BOOT-INF/classes/META-INF/pickleball/studio/tools/maven/${studioMavenVersion}/classpath.txt"
                    if (nestedJar.getEntry(mavenIndex) == null) {
                        throw new GradleException('Nested Studio JAR is missing the bundled Maven runtime index')
                    }
                    def mavenEmbedder = "BOOT-INF/classes/META-INF/pickleball/studio/tools/maven/${studioMavenVersion}/lib/maven-embedder-${studioMavenVersion}.jar"
                    if (nestedJar.getEntry(mavenEmbedder) == null) {
                        throw new GradleException('Nested Studio JAR is missing the bundled Maven embedder runtime')
                    }
                }
            } finally {
                nestedFile.delete()
            }
        }
    }
}
