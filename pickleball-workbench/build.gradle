plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'maven-publish'
}

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // Deliberately target the root project's published-equivalent shaded/woven
    // variant. Do not replace this with a naïve implementation project(':').
    implementation project(path: ':', configuration: 'pickleballPublishedElements')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
}

application {
    mainClass = 'tools.dscode.workbench.WorkbenchApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

tasks.jar {
    enabled = false
}

tasks.shadowJar {
    archiveBaseName.set('pickleball-workbench')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    zip64 = true

    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'Pickleball Workbench',
                'Implementation-Version': project.version.toString()
        )
    }
}

tasks.assemble {
    dependsOn tasks.shadowJar
}

publishing {
    repositories {
        maven {
            name = 'staging'
            url = rootProject.layout.buildDirectory.dir('maven-central-staging')
        }
    }

    publications {
        create('maven', MavenPublication) {
            groupId = project.group as String
            artifactId = 'pickleball-workbench'
            version = project.version as String

            artifact(tasks.named('shadowJar')) {
                builtBy tasks.named('shadowJar')
            }
            artifact(tasks.named('sourcesJar'))
            artifact(tasks.named('javadocJar'))

            pom {
                name.set('pickleball-workbench')
                description.set('Executable companion controller for interactive Pickleball runtime tooling')
                url.set('https://github.com/ds-code-t/pickleball')

                licenses {
                    license {
                        name.set('Apache License, Version 2.0')
                        url.set('https://www.apache.org/licenses/LICENSE-2.0')
                    }
                }

                scm {
                    url.set('https://github.com/ds-code-t/pickleball')
                    connection.set('scm:git:git://github.com/ds-code-t/pickleball.git')
                    developerConnection.set('scm:git:ssh://git@github.com/ds-code-t/pickleball.git')
                }

                developers {
                    developer {
                        id.set('ds-code-t')
                        name.set('DSCode Tools')
                        url.set('https://github.com/ds-code-t')
                    }
                }
            }

            // The executable shades its implementation libraries. Its only
            // published dependency contract is the normal Pickleball artifact.
            pom.withXml {
                def pomNode = asNode()
                def depsNodeList = pomNode.get('dependencies') as groovy.util.NodeList
                def depsNode = (depsNodeList && depsNodeList.size() > 0)
                        ? (groovy.util.Node) depsNodeList[0]
                        : pomNode.appendNode('dependencies')
                depsNode.children().clear()

                def dependency = depsNode.appendNode('dependency')
                dependency.appendNode('groupId', rootProject.group.toString())
                dependency.appendNode('artifactId', 'pickleball')
                dependency.appendNode('version', rootProject.version.toString())
                dependency.appendNode('scope', 'compile')
            }
        }
    }
}

def workbenchJar = tasks.named('shadowJar').flatMap { it.archiveFile }
def rootPickleballJar = rootProject.tasks.named('shadowJar').flatMap { it.archiveFile }

tasks.register('verifyWorkbenchArtifact') {
    group = 'verification'
    description = 'Verifies the Workbench executable JAR and one-way packaging boundary.'
    dependsOn tasks.shadowJar, rootProject.tasks.named('shadowJar')

    doLast {
        def jarFile = workbenchJar.get().asFile
        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            def mainClass = jar.manifest?.mainAttributes?.getValue('Main-Class')
            if (mainClass != application.mainClass.get()) {
                throw new GradleException("Unexpected Workbench Main-Class: ${mainClass}")
            }
            if (jar.getEntry('tools/dscode/workbench/WorkbenchApplication.class') == null) {
                throw new GradleException('Workbench executable is missing WorkbenchApplication.class')
            }
        }

        new java.util.jar.JarFile(rootPickleballJar.get().asFile).withCloseable { jar ->
            def leaked = java.util.Collections.list(jar.entries()).findAll { entry ->
                entry.name.startsWith('tools/dscode/workbench/') ||
                        entry.name.startsWith('META-INF/pickleball/workbench/')
            }
            if (!leaked.isEmpty()) {
                throw new GradleException(
                        'Workbench content leaked into the normal Pickleball artifact: ' +
                                leaked.collect { it.name }.take(10)
                )
            }
        }
    }
}

tasks.register('verifyWorkbenchRuntimeBoundary') {
    group = 'verification'
    description = 'Verifies Workbench resolves the shaded Pickleball artifact without unpublished/control or unwoven Cucumber variants.'
    dependsOn rootProject.tasks.named('shadowJar')

    doLast {
        def artifacts = configurations.runtimeClasspath.incoming.artifacts.artifacts
        def files = artifacts.collect { it.file.canonicalFile } as Set
        def expectedPickleball = rootPickleballJar.get().asFile.canonicalFile
        if (!files.contains(expectedPickleball)) {
            throw new GradleException(
                    "Workbench runtime does not contain the published-equivalent Pickleball JAR: ${expectedPickleball}"
            )
        }

        def forbiddenModules = [
                'io.cucumber:cucumber-core',
                'io.cucumber:cucumber-gherkin',
                'io.cucumber:cucumber-gherkin-messages',
                'io.cucumber:cucumber-java',
                'io.cucumber:cucumber-plugin',
                'io.cucumber:messages',
                'io.cucumber:gherkin'
        ] as Set

        def leakedModules = artifacts.findAll { artifact ->
            def component = artifact.id.componentIdentifier
            component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                    forbiddenModules.contains("${component.group}:${component.module}")
        }.collect { artifact ->
            def component = artifact.id.componentIdentifier
            "${component.group}:${component.module}:${component.version}"
        }.sort()
        if (!leakedModules.isEmpty()) {
            throw new GradleException(
                    'Workbench runtime resolved unwoven Cucumber modules outside pickleball.jar: ' + leakedModules
            )
        }

        def unpublishedControl = artifacts.findAll { artifact ->
            def component = artifact.id.componentIdentifier
            component instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier &&
                    component.projectPath == ':pickleball-control-api'
        }
        if (!unpublishedControl.isEmpty()) {
            throw new GradleException('Workbench runtime depends on unpublished :pickleball-control-api')
        }
    }
}

tasks.register('verifyWorkbenchPublishedDependencyContract') {
    group = 'verification'
    description = 'Verifies the Workbench POM declares only tools.dscode:pickleball.'
    dependsOn tasks.named('generatePomFileForMavenPublication')

    doLast {
        def pomFile = layout.buildDirectory.file('publications/maven/pom-default.xml').get().asFile
        def documentBuilderFactory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        documentBuilderFactory.setNamespaceAware(false)
        def document = documentBuilderFactory.newDocumentBuilder().parse(pomFile)
        def xpath = javax.xml.xpath.XPathFactory.newInstance().newXPath()
        def dependencyNodes = xpath.evaluate(
                '/project/dependencies/dependency',
                document,
                javax.xml.xpath.XPathConstants.NODESET
        )
        def dependencies = (0..<dependencyNodes.length).collect { index ->
            def dependency = dependencyNodes.item(index)
            [
                    xpath.evaluate('groupId', dependency),
                    xpath.evaluate('artifactId', dependency),
                    xpath.evaluate('version', dependency),
                    xpath.evaluate('scope', dependency)
            ]
        }
        def expected = [[
                rootProject.group.toString(),
                'pickleball',
                rootProject.version.toString(),
                'compile'
        ]]
        if (dependencies != expected) {
            throw new GradleException("Unexpected Workbench published dependencies: ${dependencies}; expected ${expected}")
        }
    }
}

def entrypointOutput = new ByteArrayOutputStream()
tasks.register('verifyWorkbenchEntrypoint', Exec) {
    group = 'verification'
    description = 'Runs the packaged Workbench executable and verifies its version command.'
    dependsOn tasks.shadowJar
    standardOutput = entrypointOutput
    errorOutput = new ByteArrayOutputStream()

    doFirst {
        def launcher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get()
        commandLine(
                launcher.executablePath.asFile.absolutePath,
                '-jar',
                workbenchJar.get().asFile.absolutePath,
                '--version'
        )
    }

    doLast {
        def expected = "Pickleball Workbench ${project.version}${System.lineSeparator()}"
        def actual = entrypointOutput.toString('UTF-8')
        if (actual != expected) {
            throw new GradleException("Unexpected Workbench --version output: ${actual.inspect()}")
        }
    }
}

tasks.named('test') {
    dependsOn rootProject.tasks.named('verifyPickleballPublishedElements')
    finalizedBy(
            tasks.named('verifyWorkbenchArtifact'),
            tasks.named('verifyWorkbenchRuntimeBoundary'),
            tasks.named('verifyWorkbenchPublishedDependencyContract'),
            tasks.named('verifyWorkbenchEntrypoint')
    )
}
