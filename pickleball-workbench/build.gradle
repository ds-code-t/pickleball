plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'maven-publish'
    id 'signing'
}

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
    withJavadocJar()
}

def mcpSdkVersion = '2.0.0'
def javafxVersion = '21.0.6'
def javafxModules = ['base', 'graphics', 'controls', 'swing', 'media', 'web']
def javafxPlatforms = ['linux', 'win', 'mac', 'mac-aarch64']
def javafxCompilePlatform = {
    def os = org.gradle.internal.os.OperatingSystem.current()
    def arch = System.getProperty('os.arch', '')
    boolean arm = arch.contains('aarch64') || arch.contains('arm64')
    if (os.windows) return 'win'
    if (os.macOsX) return arm ? 'mac-aarch64' : 'mac'
    return 'linux'
}()

configurations {
    javafxNatives
}

dependencies {
    // Workbench shares only the JDK-only wire contract with the consumer worker.
    // It must never compile or run against the root Pickleball runtime.
    implementation project(':pickleball-control-protocol')

    // OpenJFX WebView is Workbench-only presentation. It is not a Pickleball
    // runtime dependency and is preferred over JCEF so natives stay in Maven
    // artifacts that can be shaded into the controller executable.
    javafxModules.each { module ->
        implementation "org.openjfx:javafx-${module}:${javafxVersion}:${javafxCompilePlatform}"
    }
    javafxPlatforms.each { platform ->
        javafxModules.each { module ->
            javafxNatives "org.openjfx:javafx-${module}:${javafxVersion}:${platform}"
        }
    }

    // Controller-side JSON transport. This is declared directly instead of
    // inheriting it through Pickleball core.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'

    // Keep MCP Workbench-only and non-Spring. Jackson 2 matches Pickleball's
    // existing ObjectMapper usage without pulling the SDK convenience/Jackson 3 path.
    implementation "io.modelcontextprotocol.sdk:mcp-core:${mcpSdkVersion}"
    implementation "io.modelcontextprotocol.sdk:mcp-json-jackson2:${mcpSdkVersion}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

application {
    mainClass = 'tools.dscode.workbench.WorkbenchApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

tasks.jar {
    enabled = false
}

def javafxNativeStage = tasks.register('stageJavaFxNatives') {
    def outputDir = layout.buildDirectory.dir('javafx-natives')
    outputs.dir(outputDir)
    doLast {
        def dest = outputDir.get().asFile
        dest.deleteDir()
        dest.mkdirs()
        configurations.javafxNatives.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            String classifier = artifact.classifier ?: 'unknown'
            def target = new File(dest, classifier)
            target.mkdirs()
            copy {
                from zipTree(artifact.file)
                into target
                include '**/*.so'
                include '**/*.dll'
                include '**/*.dylib'
                include '**/*.jnilib'
                includeEmptyDirs = false
                eachFile { details ->
                    details.path = details.name
                }
            }
            new File(target, '.keep').text = ''
        }
    }
}

tasks.named('processResources') {
    dependsOn javafxNativeStage
    from(layout.buildDirectory.dir('javafx-natives')) {
        into 'javafx-natives'
    }
}

tasks.shadowJar {
    dependsOn javafxNativeStage
    archiveBaseName.set('pickleball-workbench')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    zip64 = true
    exclude 'module-info.class'
    exclude { details ->
        String path = details.path ?: ''
        String name = details.name ?: ''
        boolean nativeLib = name.endsWith('.so') || name.endsWith('.dll') ||
                name.endsWith('.dylib') || name.endsWith('.jnilib')
        nativeLib && !path.startsWith('javafx-natives/')
    }

    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'Pickleball Workbench',
                'Implementation-Version': project.version.toString()
        )
    }
}

tasks.assemble {
    dependsOn tasks.shadowJar
}

// The Shadow plugin supplies the executable JAR used by the Application plugin's
// distributions. Gradle 9 requires those consumers to declare the producer task.
def workbenchShadowJarTask = tasks.named('shadowJar')
['startScripts', 'distZip', 'distTar', 'installDist'].each { taskName ->
    tasks.named(taskName) {
        dependsOn workbenchShadowJarTask
    }
}

publishing {
    repositories {
        maven {
            name = 'staging'
            url = rootProject.layout.buildDirectory.dir('maven-central-staging')
        }
    }

    publications {
        create('maven', MavenPublication) {
            groupId = project.group as String
            artifactId = 'pickleball-workbench'
            version = project.version as String

            artifact(tasks.named('shadowJar')) {
                builtBy tasks.named('shadowJar')
            }
            artifact(tasks.named('sourcesJar'))
            artifact(tasks.named('javadocJar'))

            pom {
                name.set('pickleball-workbench')
                description.set('Executable companion controller for interactive Pickleball runtime tooling')
                url.set('https://github.com/ds-code-t/pickleball')

                licenses {
                    license {
                        name.set('Apache License, Version 2.0')
                        url.set('https://www.apache.org/licenses/LICENSE-2.0')
                    }
                }

                scm {
                    url.set('https://github.com/ds-code-t/pickleball')
                    connection.set('scm:git:git://github.com/ds-code-t/pickleball.git')
                    developerConnection.set('scm:git:ssh://git@github.com/ds-code-t/pickleball.git')
                }

                developers {
                    developer {
                        id.set('ds-code-t')
                        name.set('DSCode Tools')
                        url.set('https://github.com/ds-code-t')
                    }
                }
            }

            // The executable shades all controller dependencies. It has no
            // published dependency on Pickleball core or the protocol module.
            pom.withXml {
                def pomNode = asNode()
                def depsNodeList = pomNode.get('dependencies') as groovy.util.NodeList
                def depsNode = (depsNodeList && depsNodeList.size() > 0)
                        ? (groovy.util.Node) depsNodeList[0]
                        : pomNode.appendNode('dependencies')
                depsNode.children().clear()
            }
        }
    }
}

def requested = gradle.startParameter.taskNames*.toLowerCase()
def isMavenLocalPublish = requested.any { it.contains('publishtomavenlocal') }
def isStagingPublish =
        requested.any { it.contains('centralbundlezip') } ||
                requested.any { it.contains('publishmavenpublicationtostagingrepository') } ||
                requested.any { it.contains('publishallpublicationstostagingrepository') } ||
                requested.any { it.contains('closeandrelease') } ||
                requested.any { it.contains('releasesonatype') } ||
                requested.any { it.contains('publishsonatype') }
def signingIsRequired = isStagingPublish && !isMavenLocalPublish

signing {
    required = { signingIsRequired }

    def key = (findProperty('signingKey') ?: System.getenv('SIGNING_KEY'))?.toString()
    def pass = (findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD'))?.toString()

    if (signingIsRequired) {
        if (!key) {
            throw new GradleException(
                    'Signing is required for staging publish, but no signingKey/SIGNING_KEY was provided.'
            )
        }
        useInMemoryPgpKeys(key, pass)
        sign(publishing.publications.named('maven').get())
    }
}

tasks.withType(Sign).configureEach {
    onlyIf { !isMavenLocalPublish }
}

def workbenchJar = tasks.named('shadowJar').flatMap { it.archiveFile }

tasks.named('test') {
    dependsOn tasks.shadowJar
    doFirst {
        systemProperty 'pickleball.workbench.test.jar', workbenchJar.get().asFile.absolutePath
    }
}
tasks.register('verifyWorkbenchArtifact') {
    group = 'verification'
    description = 'Verifies the Workbench executable contains controller code and no Pickleball runtime.'
    dependsOn tasks.shadowJar

    doLast {
        def jarFile = workbenchJar.get().asFile
        def forbiddenPrefixes = [
                'tools/dscode/testengine/',
                'tools/dscode/common/',
                'tools/dscode/coredefinitions/',
                'tools/dscode/pickleruntime/',
                'tools/dscode/control/api/',
                'tools/dscode/control/bridge/',
                'tools/dscode/control/override/',
                'io/cucumber/',
                'org/openqa/selenium/',
                'io/restassured/'
        ]
        def forbiddenProviderPrefixes = forbiddenPrefixes.collect { prefix ->
            prefix.replace('/', '.')
        }
        def forbidden = []

        def scanNestedJar
        scanNestedJar = { InputStream input, String source ->
            new java.util.zip.ZipInputStream(input).withCloseable { nested ->
                java.util.zip.ZipEntry entry
                while ((entry = nested.nextEntry) != null) {
                    String name = entry.name
                    if (forbiddenPrefixes.any { name.startsWith(it) }) {
                        forbidden.add("${source}!/${name}")
                    }
                    if (!entry.directory && name.endsWith('.jar')) {
                        scanNestedJar(
                                new ByteArrayInputStream(nested.readAllBytes()),
                                "${source}!/${name}"
                        )
                    } else if (!entry.directory && name.startsWith('META-INF/services/')) {
                        String providers = new String(
                                nested.readAllBytes(),
                                java.nio.charset.StandardCharsets.UTF_8
                        )
                        if (providers.readLines().collect { line ->
                            line.replaceFirst(/#.*/, '').trim()
                        }.any { provider ->
                            forbiddenProviderPrefixes.any { provider.startsWith(it) }
                        }) {
                            forbidden.add("${source}!/${name} -> ${providers.trim()}")
                        }
                    }
                }
            }
        }

        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            def mainClass = jar.manifest?.mainAttributes?.getValue('Main-Class')
            if (mainClass != application.mainClass.get()) {
                throw new GradleException("Unexpected Workbench Main-Class: ${mainClass}")
            }
            if (jar.getEntry('tools/dscode/workbench/WorkbenchApplication.class') == null) {
                throw new GradleException('Workbench executable is missing WorkbenchApplication.class')
            }
            if (jar.getEntry('tools/dscode/workbench/WorkbenchRuntimeBoundary.class') == null) {
                throw new GradleException('Workbench executable is missing its runtime isolation guard')
            }
            if (jar.getEntry('tools/dscode/workbench/WorkbenchController.class') == null) {
                throw new GradleException('Workbench executable is missing its shared controller service')
            }
            if (jar.getEntry('tools/dscode/workbench/bridge/ControlBridgeClient.class') == null) {
                throw new GradleException('Workbench executable is missing its neutral protocol client')
            }
            if (jar.getEntry('tools/dscode/workbench/ui/WorkbenchUi.class') == null) {
                throw new GradleException('Workbench executable is missing its GUI adapter')
            }
            if (jar.getEntry('tools/dscode/workbench/mcp/WorkbenchMcpServer.class') == null) {
                throw new GradleException('Workbench executable is missing WorkbenchMcpServer.class')
            }
            if (jar.getEntry('tools/dscode/control/protocol/ControlProtocol.class') == null) {
                throw new GradleException('Workbench executable is missing the neutral control protocol')
            }

            java.util.Collections.list(jar.entries()).each { entry ->
                String name = entry.name
                if (forbiddenPrefixes.any { name.startsWith(it) }) {
                    forbidden.add(name)
                }
                if (!entry.directory && name.endsWith('.jar')) {
                    jar.getInputStream(entry).withCloseable { stream ->
                        scanNestedJar(stream, name)
                    }
                } else if (!entry.directory && name.startsWith('META-INF/services/')) {
                    String providers = jar.getInputStream(entry).getText('UTF-8')
                    if (providers.readLines().collect { line ->
                        line.replaceFirst(/#.*/, '').trim()
                    }.any { provider ->
                        forbiddenProviderPrefixes.any { provider.startsWith(it) }
                    }) {
                        forbidden.add("${name} -> ${providers.trim()}")
                    }
                }
            }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    'Pickleball runtime content leaked into the controller-only Workbench JAR: ' +
                            forbidden.take(20)
            )
        }
    }
}

tasks.register('verifyWorkbenchRuntimeBoundary') {
    group = 'verification'
    description = 'Verifies Workbench compile/runtime graphs resolve only the neutral protocol and controller libraries.'
    dependsOn ':pickleball-control-protocol:verifyProtocolIsolation'

    doLast {
        ['compileClasspath', 'runtimeClasspath'].each { configurationName ->
            def artifacts = configurations.named(configurationName).get()
                    .incoming.artifacts.artifacts
            def projectDependencies = artifacts.findAll { artifact ->
                def component = artifact.id.componentIdentifier
                component instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier
            }.collect { artifact ->
                def component = artifact.id.componentIdentifier
                component.projectPath
            }.sort()
            if (projectDependencies != [':pickleball-control-protocol']) {
                throw new GradleException(
                        "Workbench ${configurationName} project dependencies must be exactly " +
                                ':pickleball-control-protocol: ' + projectDependencies
                )
            }

            def forbiddenModules = artifacts.findAll { artifact ->
                def component = artifact.id.componentIdentifier
                if (!(component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) {
                    return false
                }
                component.group == 'io.cucumber' ||
                        component.group == 'org.seleniumhq.selenium' ||
                        component.group == 'io.rest-assured' ||
                        (component.group == 'tools.dscode' && component.module == 'pickleball') ||
                        (component.group == 'io.modelcontextprotocol.sdk' &&
                                (component.module == 'mcp' || component.module == 'mcp-json-jackson3'))
            }.collect { artifact ->
                def component = artifact.id.componentIdentifier
                "${component.group}:${component.module}:${component.version}"
            }.sort()
            if (!forbiddenModules.isEmpty()) {
                throw new GradleException(
                        "Workbench ${configurationName} resolved forbidden execution-plane modules: " +
                                forbiddenModules
                )
            }

            def forbiddenFiles = artifacts.collect { it.file.name }.findAll { name ->
                name ==~ /pickleball-\d.*\.jar/
            }
            if (!forbiddenFiles.isEmpty()) {
                throw new GradleException(
                        "Workbench ${configurationName} resolved a Pickleball core JAR: " +
                                forbiddenFiles
                )
            }
        }
    }
}

tasks.register('verifyWorkbenchPublishedDependencyContract') {
    group = 'verification'
    description = 'Verifies the self-contained Workbench POM declares no Pickleball dependency.'
    dependsOn tasks.named('generatePomFileForMavenPublication')

    doLast {
        def pomFile = layout.buildDirectory.file('publications/maven/pom-default.xml').get().asFile
        def documentBuilderFactory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        documentBuilderFactory.setNamespaceAware(false)
        def document = documentBuilderFactory.newDocumentBuilder().parse(pomFile)
        def xpath = javax.xml.xpath.XPathFactory.newInstance().newXPath()
        def dependencyNodes = xpath.evaluate(
                '/project/dependencies/dependency',
                document,
                javax.xml.xpath.XPathConstants.NODESET
        )
        def dependencies = (0..<dependencyNodes.length).collect { index ->
            def dependency = dependencyNodes.item(index)
            [
                    xpath.evaluate('groupId', dependency),
                    xpath.evaluate('artifactId', dependency),
                    xpath.evaluate('version', dependency),
                    xpath.evaluate('scope', dependency)
            ]
        }
        def expected = []
        if (dependencies != expected) {
            throw new GradleException("Unexpected Workbench published dependencies: ${dependencies}; expected ${expected}")
        }
    }
}

def entrypointOutput = new ByteArrayOutputStream()
tasks.register('verifyWorkbenchEntrypoint', Exec) {
    group = 'verification'
    description = 'Runs the packaged Workbench executable and verifies its version command.'
    dependsOn tasks.shadowJar
    standardOutput = entrypointOutput
    errorOutput = new ByteArrayOutputStream()

    doFirst {
        def launcher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get()
        commandLine(
                launcher.executablePath.asFile.absolutePath,
                '-jar',
                workbenchJar.get().asFile.absolutePath,
                '--version'
        )
    }

    doLast {
        def expected = "Pickleball Workbench ${project.version}${System.lineSeparator()}"
        def actual = entrypointOutput.toString('UTF-8')
        if (actual != expected) {
            throw new GradleException("Unexpected Workbench --version output: ${actual.inspect()}")
        }
    }
}

tasks.register('verifyWorkbenchMcpStdio') {
    group = 'verification'
    description = 'Runs an interactive packaged stdio MCP handshake/tool-list probe and verifies stdout is JSON-RPC only.'
    dependsOn tasks.shadowJar

    doLast {
        def launcher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get()
        def process = new ProcessBuilder(
                launcher.executablePath.asFile.absolutePath,
                '-jar',
                workbenchJar.get().asFile.absolutePath,
                'mcp',
                rootProject.projectDir.absolutePath
        ).start()
        def writer = process.outputStream.newWriter('UTF-8')
        def reader = process.inputStream.newReader('UTF-8')
        def stderr = new ByteArrayOutputStream()
        def stderrThread = new Thread({
            try {
                process.errorStream.transferTo(stderr)
            } catch (Exception ignored) {
                // Process shutdown closes the stream.
            }
        }, 'workbench-mcp-probe-stderr')
        stderrThread.daemon = true
        stderrThread.start()
        def reads = java.util.concurrent.Executors.newSingleThreadExecutor({ runnable ->
            def thread = new Thread(runnable, 'workbench-mcp-probe-stdout')
            thread.daemon = true
            thread
        } as java.util.concurrent.ThreadFactory)

        def send = { Map message ->
            writer.write(groovy.json.JsonOutput.toJson(message))
            writer.write(System.lineSeparator())
            writer.flush()
        }
        def readResponse = { int timeoutSeconds ->
            def future = reads.submit({ reader.readLine() } as java.util.concurrent.Callable<String>)
            try {
                def line = future.get(timeoutSeconds, java.util.concurrent.TimeUnit.SECONDS)
                if (line == null) {
                    throw new GradleException(
                            "Workbench MCP stdout closed before a response. stderr=${stderr.toString('UTF-8')}"
                    )
                }
                try {
                    return new groovy.json.JsonSlurper().parseText(line)
                } catch (Exception failure) {
                    throw new GradleException("Non-protocol output on Workbench MCP stdout: ${line}", failure)
                }
            } catch (java.util.concurrent.TimeoutException failure) {
                throw new GradleException(
                        "Timed out waiting for Workbench MCP response. stderr=${stderr.toString('UTF-8')}",
                        failure
                )
            } finally {
                if (!future.isDone()) future.cancel(true)
            }
        }

        try {
            send([
                    jsonrpc: '2.0', id: 1, method: 'initialize', params: [
                    protocolVersion: '2025-11-25', capabilities: [:],
                    clientInfo: [name: 'gradle-probe', version: '1.0']
            ]])
            def initialized = readResponse(15)
            if (initialized.id != 1 || initialized.result?.serverInfo?.name != 'pickleball-workbench') {
                throw new GradleException("Unexpected Workbench MCP initialize response: ${initialized}")
            }

            send([jsonrpc: '2.0', method: 'notifications/initialized', params: [:]])
            send([jsonrpc: '2.0', id: 2, method: 'tools/list', params: [:]])
            def listed = readResponse(5)
            def names = (listed.result?.tools ?: []).collect { it.name } as Set
            if (!names.containsAll([
                    'workbench_worker_status',
                    'workbench_execute_step',
                    'workbench_step_override_compile',
                    'workbench_request_control',
                    'workbench_player_state',
                    'workbench_request_save'
            ])) {
                throw new GradleException("Workbench MCP tool list is incomplete: ${names}")
            }

            writer.close()
            if (!process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)) {
                process.destroy()
                if (!process.waitFor(2, java.util.concurrent.TimeUnit.SECONDS)) process.destroyForcibly()
                throw new GradleException('Workbench MCP process did not exit after stdin closed.')
            }
            if (process.exitValue() != 0) {
                throw new GradleException(
                        "Workbench MCP process exited ${process.exitValue()}. stderr=${stderr.toString('UTF-8')}"
                )
            }
            def extra = reader.readLine()
            if (extra != null && !extra.isBlank()) {
                throw new GradleException("Unexpected extra Workbench MCP stdout: ${extra}")
            }
        } finally {
            reads.shutdownNow()
            try { writer.close() } catch (Exception ignored) { }
            process.destroyForcibly()
            try { reader.close() } catch (Exception ignored) { }
        }
    }
}

tasks.register('reportWorkbenchMcpImpact') {
    group = 'verification'
    description = 'Reports Workbench executable size and resolved MCP dependency artifacts.'
    dependsOn tasks.shadowJar

    doLast {
        def jarFile = workbenchJar.get().asFile
        println "Workbench executable: ${jarFile.absolutePath}"
        println "Workbench executable bytes: ${jarFile.length()}"

        def mcpArtifacts = configurations.runtimeClasspath.incoming.artifacts.artifacts.findAll { artifact ->
            def component = artifact.id.componentIdentifier
            component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                    component.group == 'io.modelcontextprotocol.sdk'
        }.collect { artifact ->
            def component = artifact.id.componentIdentifier
            "${component.group}:${component.module}:${component.version} (${artifact.file.length()} bytes)"
        }.sort()

        println 'Resolved MCP SDK artifacts:'
        mcpArtifacts.each { println "  ${it}" }

        def renderDependency
        renderDependency = { dependency, String indent ->
            println "${indent}${dependency.moduleGroup}:${dependency.moduleName}:${dependency.moduleVersion}"
            dependency.children.toList().sort { a, b ->
                "${a.moduleGroup}:${a.moduleName}" <=> "${b.moduleGroup}:${b.moduleName}"
            }.each { child -> renderDependency(child, indent + '  ') }
        }
        println 'MCP dependency tree:'
        configurations.runtimeClasspath.resolvedConfiguration.firstLevelModuleDependencies
                .findAll { it.moduleGroup == 'io.modelcontextprotocol.sdk' }
                .sort { a, b -> a.moduleName <=> b.moduleName }
                .each { dependency -> renderDependency(dependency, '  ') }
    }
}

tasks.named('test') {
    finalizedBy(
            tasks.named('verifyWorkbenchArtifact'),
            tasks.named('verifyWorkbenchRuntimeBoundary'),
            tasks.named('verifyWorkbenchPublishedDependencyContract'),
            tasks.named('verifyWorkbenchEntrypoint'),
            tasks.named('verifyWorkbenchMcpStdio'),
            tasks.named('reportWorkbenchMcpImpact')
    )
}
