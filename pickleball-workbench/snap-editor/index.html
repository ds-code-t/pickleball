<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snap-editor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="has-script" data-pack="pickleball">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          snap-editor
        </div>
        <div class="pack-tabs" role="tablist" aria-label="Pack">
          <button type="button" class="pack-tab" role="tab" data-pack="pickleball" aria-selected="true">
            Pickleball steps
          </button>
        </div>
        <button type="button" id="btn-dev-packs" class="ghost">Developer packs</button>
        <div class="pack-tabs dev-packs" id="dev-packs" hidden>
          <button type="button" class="pack-tab" role="tab" data-pack="core" aria-selected="false">Generic blocks</button>
          <button type="button" class="pack-tab" role="tab" data-pack="typed" aria-selected="false">Typed</button>
        </div>
        <div class="hint">Click to type · drag to snap · space-drag to pan</div>
        <div class="actions">
          <button type="button" id="btn-example">Load example</button>
          <button type="button" id="btn-clear">Clear</button>
          <button type="button" id="btn-undo">Undo</button>
          <button type="button" id="btn-redo">Redo</button>
        </div>
      </header>
      <aside class="toolbox">
        <div class="panel-title">Blocks</div>
        <div class="toolbox-list" id="toolbox"></div>
        <div class="inspector" id="inspector">
          <div class="inspector-body" id="inspector-body"></div>
        </div>
      </aside>
      <main class="stage">
        <div id="editor"></div>
        <div class="empty-hint" id="empty-hint">Drag a Feature, Scenario, or Step from the left</div>
      </main>
      <aside class="script-panel" id="script-panel">
        <div class="panel-title">Gherkin</div>
        <div class="json-toolbar">
          <span class="hint">The scenario as text</span>
          <button type="button" id="btn-copy-gherkin">Copy</button>
        </div>
        <pre class="json-view script-view" id="gherkin"></pre>
        <details class="raw-json" id="json-drawer">
          <summary>Raw JSON</summary>
          <div class="json-toolbar">
            <span class="hint">Not the document you edit</span>
            <button type="button" id="btn-copy">Copy</button>
          </div>
          <pre class="json-view" id="json"></pre>
        </details>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
