<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>shadow-nested</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>

<div id="host"></div>
<script>
const r = document.getElementById("host").attachShadow({mode:"open"});
r.innerHTML = '<div id="mid"></div>';
const mid = r.getElementById("mid");
const r2 = mid.attachShadow({mode:"open"});
r2.innerHTML = '<button id="inner">in</button>';
</script>

</body>
</html>
