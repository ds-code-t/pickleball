<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>a11y-labels</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>

<label>Wrap name <input id="wrap"></label>
<label for="forid">For name</label><input id="forid">
<input id="aria" aria-label="Aria name">
<span id="p1">First</span> <span id="p2">Second</span>

<input id="ph" placeholder="Place only">
<img id="pic" alt="Alt words" src="/pixel.gif" width="40" height="40">
<span id="ti" title="Title words">x</span>

</body>
</html>
