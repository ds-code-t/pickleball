<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>angular virtual</title>
<link rel="stylesheet" href="/site.css">

</head>
<body>
<div ng-app="vapp" ng-controller="vc">
  <div id="list" data-virtual-total="1000" data-virtual-rendered="8">
    <div class="css-ng91 row" ng-repeat="row in rows">{{row.label}}</div>
  </div>
</div>
<script src="/vendor/angular.min.js"></script>
<script>
angular.module("vapp", []).controller("vc", function ($scope) {
  $scope.rows = [];
  for (var i = 0; i < 8; i++) $scope.rows.push({id: i, label: "row-" + i});
});
</script>

</body>
</html>
