<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>react window</title>
<link rel="stylesheet" href="/site.css">

</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script>
const e = React.createElement;
const rows = [];
for (let i = 0; i < 8; i++) rows.push(e("div", {key: String(i), className: "row"}, "row-" + i));
const list = e("div", {id: "list", "data-virtual-total": "1000", "data-virtual-rendered": "8"}, rows);
ReactDOM.createRoot(document.getElementById("root")).render(list);
</script>

</body>
</html>
