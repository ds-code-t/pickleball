<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>animation</title>
<link rel="stylesheet" href="/site.css">

</head>
<body>
<style>
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
#box { position: absolute; left: 64px; top: 64px; width: 120px; height: 120px; background: #36c;
  animation: spin 1s linear infinite; }
</style>
<div id="box">spin</div>

</body>
</html>
