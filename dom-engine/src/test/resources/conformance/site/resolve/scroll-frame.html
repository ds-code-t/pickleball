<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>resolve scroll frame</title>
<style>
  html, body, #outer, #inner { margin: 0; padding: 0; scroll-behavior: auto; }
  #outer {
    overflow: auto;
    width: 160px;
    height: 110px;
    box-sizing: border-box;
  }
  #inner {
    overflow: auto;
    width: 140px;
    height: 70px;
    box-sizing: border-box;
  }
  #deep { margin-top: 420px; width: 40px; height: 28px; }
</style>
</head>
<body>
<div id="outer">
  <div id="inner">
    <div id="deep">deep-word</div>
  </div>
</div>
</body>
</html>
