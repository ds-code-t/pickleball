<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gap-deep-frame</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div id="slot-host">
  <span id="slotted" slot="body">slotted-word</span>
</div>
<div id="inner"></div>
<script>
const closed = document.getElementById("inner").attachShadow({mode: "closed"});
closed.innerHTML = '<button id="leaf">leaf</button>';
const open = document.getElementById("slot-host").attachShadow({mode: "open"});
open.innerHTML = '<slot name="body"><span id="fallback">hidden-fallback</span></slot>';
</script>
</body>
</html>
