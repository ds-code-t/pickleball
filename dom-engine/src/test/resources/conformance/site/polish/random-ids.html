<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>polish-random-ids</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<button id="alpha" data-stable="alpha" style="position:absolute;left:40px;top:40px">Alpha</button>
<button id="beta" data-stable="beta" style="position:absolute;left:40px;top:100px">Beta</button>
<script>
let n = 0;
for (const el of [document.getElementById("alpha"), document.getElementById("beta")]) {
  n += 1;
  el.id = "id-" + n + "-" + Math.floor(Math.random() * 1e9);
}
</script>
</body>
</html>
