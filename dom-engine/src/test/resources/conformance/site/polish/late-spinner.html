<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>polish-late-spinner</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div id="spin" class="spinner" data-loader="spinner" style="position:absolute;left:64px;top:64px;width:320px;height:160px;background:rgba(20,20,20,.35);z-index:4">spinning</div>
<script>
let n = 0;
const timer = setInterval(function () {
  n += 1;
  document.documentElement.setAttribute("data-tick", String(n));
  if (n < 8) return;
  clearInterval(timer);
  const b = document.createElement("button");
  b.id = "go";
  b.className = "box";
  b.textContent = "Ready";
  document.body.appendChild(b);
}, 50);
</script>
</body>
</html>
