<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>shadow iframe</title>
<link rel="stylesheet" href="/site.css">

</head>
<body>
<div id="host"></div>
<script>
const r = document.getElementById("host").attachShadow({mode: "open"});
r.innerHTML = '<iframe id="inf" src="/frames/shadow-child.html" style="width:320px;height:140px;border:0"></iframe>';
</script>

</body>
</html>
