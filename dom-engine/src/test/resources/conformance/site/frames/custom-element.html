<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>custom element</title>
<link rel="stylesheet" href="/site.css">

</head>
<body>
<script>
class MyButton extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({mode: "open"}).innerHTML = '<button id="ce" style="position:absolute;left:64px;top:64px;width:320px;height:160px;border:0;background:#36c;color:#fff">go</button>';
  }
}
customElements.define("my-button", MyButton);
</script>
<my-button id="el"></my-button>

</body>
</html>
