<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>closed shadow</title>
<link rel="stylesheet" href="/site.css">

</head>
<body>
<div id="host" class="box"></div>
<script>
const r = document.getElementById("host").attachShadow({mode: "closed"});
r.innerHTML = '<span id="secret">secret</span>';
</script>

</body>
</html>
