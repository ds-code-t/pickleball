<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>print</title>
<link rel="stylesheet" href="/site.css">

</head>
<body>
<style>
#screen-only { display: block; }
#print-only { display: none; }
@media print {
  #screen-only { display: none; }
  #print-only { display: block; }
}
</style>
<p id="screen-only">screen</p>
<p id="print-only">print-me</p>

</body>
</html>
