<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>canvas</title>
<link rel="stylesheet" href="/site.css">

</head>
<body>
<button id="under" class="box">under</button>
<canvas id="c" class="box" width="320" height="160"></canvas>
<script>
const g = document.getElementById("c").getContext("2d");
g.fillStyle = "#c33";
g.fillRect(0, 0, 320, 160);
</script>

</body>
</html>
