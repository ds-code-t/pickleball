<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>popover</title>
<link rel="stylesheet" href="/site.css">

</head>
<body>
<style>
#pop { position: fixed; inset: auto; top: 40px; left: 40px; width: 360px; height: 220px;
  margin: 0; border: 0; padding: 0; background: #c33; }
</style>
<button id="go" class="box">Go</button>
<div id="pop" popover="manual">popover-body</div>
<script>document.getElementById("pop").showPopover();</script>

</body>
</html>
